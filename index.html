<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF 3D Viewer - Teaching Contest v24</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root{
      --bg:#030712;
      --panel:rgba(8,16,32,.88);
      --panel2:rgba(10,22,44,.94);
      --cyan:#22f8ff;
      --lime:#a6ff2d;
      --magenta:#ff2deb;
      --yellow:#ffe66d;
      --text:#eafbff;
      --sub:#96a8c8;
      --line:rgba(34,248,255,.34);
      --shadow:0 0 18px rgba(34,248,255,.18),0 0 30px rgba(255,45,235,.08);
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(34,248,255,.10), transparent 28%),
        radial-gradient(circle at 86% 76%, rgba(255,45,235,.10), transparent 32%),
        linear-gradient(135deg,#02030a,#061020 58%,#050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:50;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,248,255,.022) 1px,transparent 1px);
      background-size:4px 4px,18px 18px;
      mix-blend-mode:screen;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:51;
      background:linear-gradient(to bottom,rgba(255,255,255,.032),transparent 1px);
      background-size:100% 5px;
      opacity:.28;
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    #viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:1;
    }

    .refbar{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:20;
      border:1px solid var(--line);
      background:linear-gradient(90deg,rgba(8,16,32,.86),rgba(12,28,56,.64));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
    }

    .refbar-head{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      min-height:48px;
    }

    .ref-title{
      min-width:0;
    }

    .rgb-line{
      height:3px;
      margin-bottom:6px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.60);
    }

    .title{
      font-size:17px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .subtitle{
      margin-top:3px;
      color:var(--sub);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .refbar-body{
      display:grid;
      grid-template-columns:1.4fr auto 1fr auto auto;
      gap:8px;
      padding:0 12px 10px;
      align-items:end;
    }

    .refbar.collapsed .refbar-body{
      display:none;
    }

    .side{
      position:absolute;
      top:124px;
      bottom:86px;
      width:min(360px,calc(50vw - 18px));
      z-index:12;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .side.left{left:10px}
    .side.right{right:10px}

    .side-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      border-bottom:1px solid rgba(34,248,255,.20);
      background:linear-gradient(90deg,rgba(34,248,255,.10),rgba(255,45,235,.07));
      color:var(--cyan);
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .side-body{
      padding:10px;
      overflow:auto;
      min-height:0;
      flex:1 1 auto;
    }

    .playbar{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:22;
      min-height:66px;
      border:1px solid var(--line);
      background:rgba(4,10,20,.82);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:auto auto auto 1fr auto auto auto auto;
      gap:8px;
      align-items:center;
      padding:8px;
    }

    .playbar .speedbox{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      align-items:center;
      min-width:260px;
    }

    button,.btn{
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
    }

    button:hover,.btn:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    button.lime,.btn.lime{
      border-color:rgba(166,255,45,.52);
      color:var(--lime);
    }

    button.magenta,.btn.magenta{
      border-color:rgba(255,45,235,.52);
      color:#ffd4fb;
    }

    input,select{
      width:100%;
      min-height:34px;
      border:1px solid rgba(34,248,255,.35);
      background:rgba(1,5,14,.88);
      color:var(--text);
      padding:6px 8px;
      outline:none;
      font-size:13px;
    }

    input:focus,select:focus{
      border-color:var(--magenta);
      box-shadow:0 0 12px rgba(255,45,235,.16);
    }

    input[type="range"]{
      accent-color:var(--lime);
      padding:0;
    }

    label{
      color:var(--sub);
      font-size:11px;
      display:block;
      margin:8px 0 3px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .grid3{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .status{
      margin-top:8px;
      border:1px solid rgba(166,255,45,.26);
      background:rgba(166,255,45,.045);
      color:var(--lime);
      padding:8px;
      font-size:12px;
      line-height:1.45;
      word-break:break-all;
      font-family:Consolas,"MS UI Gothic",monospace;
    }

    .info-row{
      display:grid;
      grid-template-columns:92px 1fr;
      gap:8px;
      padding:5px 0;
      border-bottom:1px solid rgba(34,248,255,.08);
      font-size:12px;
    }

    .info-row .k{color:var(--sub)}
    .info-row .v{word-break:break-all}

    .mini{
      font-size:11px;
      color:var(--sub);
      line-height:1.45;
    }

    .chapter-card{
      border:1px solid rgba(166,255,45,.28);
      background:rgba(166,255,45,.04);
      padding:8px;
      margin-top:8px;
    }

    .hidden{display:none!important}

    @media (max-width:980px){
      html,body{overflow:auto;height:auto}
      #app{position:relative;height:auto;min-height:100vh;overflow:visible;padding:8px}
      #viewer{position:relative;height:48vh;min-height:360px;border:1px solid var(--line);margin-top:8px}
      .refbar,.side,.playbar{position:relative;top:auto;left:auto;right:auto;bottom:auto;width:auto;margin:0 0 8px}
      .refbar{clip-path:none}
      .refbar-body{grid-template-columns:1fr;align-items:stretch}
      .side{max-height:none}
      .playbar{grid-template-columns:1fr 1fr;align-items:stretch}
      .playbar .speedbox{grid-column:1/-1;min-width:0}
      .title{font-size:14px}
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewer"></canvas>

    <section class="refbar" id="refbar">
      <div class="refbar-head">
        <div class="ref-title">
          <div class="rgb-line"></div>
          <div class="title">SF 3D VIEWER / TEACHING CONTEST v24</div>
          <div class="subtitle">参照フォルダ → チャプター選択 → GLBとPDFを同時読込</div>
        </div>
        <button class="btn" id="collapseRefBtn">参照フォルダ収納</button>
        <button class="btn lime" id="scanBtn">参照読込</button>
      </div>

      <div class="refbar-body">
        <div>
          <label>参照フォルダ</label>
          <input id="rootInput" value="teaching-contest" placeholder="teaching-contest または 教材コンクール">
        </div>
        <button class="btn" id="autoRootBtn">自動検出</button>
        <div>
          <label>チャプターフォルダ</label>
          <select id="chapterSelect">
            <option value="">未読込</option>
          </select>
        </div>
        <button class="btn" id="prevChapterBtn">前CH</button>
        <button class="btn" id="nextChapterBtn">次CH</button>
      </div>
    </section>

    <aside class="side left">
      <div class="side-head">OBJECT OPERATION</div>
      <div class="side-body">
        <div class="chapter-card">
          <div class="info-row"><div class="k">CHAPTER</div><div class="v" id="chapterNameText">未選択</div></div>
          <div class="info-row"><div class="k">MODEL</div><div class="v" id="modelPathText">未読込</div></div>
          <div class="info-row"><div class="k">PDF</div><div class="v" id="pdfPathText">未読込</div></div>
        </div>

        <label>モデル倍率</label>
        <input id="modelScaleInput" type="number" step="0.01" value="1">

        <div class="grid2">
          <button class="btn lime" id="applyModelScaleBtn">倍率反映</button>
          <button class="btn" id="snapGroundBtn">地面に置く</button>
        </div>

        <label>モデル回転Y</label>
        <input id="modelRotYInput" type="number" step="1" value="0">

        <div class="grid2">
          <button class="btn" id="rotYMinusBtn">Y -90°</button>
          <button class="btn" id="rotYPlusBtn">Y +90°</button>
        </div>

        <div class="grid2">
          <button class="btn" id="fitViewBtn">全体表示</button>
          <button class="btn magenta" id="clearModelBtn">モデル消去</button>
        </div>

        <div class="status" id="objectStatus">OBJECT READY</div>
      </div>
    </aside>

    <aside class="side right">
      <div class="side-head">PDF OPERATION</div>
      <div class="side-body">
        <div class="info-row"><div class="k">PDF</div><div class="v" id="pdfNameText">未読込</div></div>

        <label>PDF配置</label>
        <select id="pdfPlacementSelect">
          <option value="floor">地面</option>
          <option value="side">側面</option>
        </select>

        <label>PDFサイズ %</label>
        <input id="pdfPercentInput" type="number" step="1" value="100">

        <label>透明度</label>
        <input id="pdfOpacityInput" type="number" min="0.05" max="1" step="0.05" value="0.65">

        <div class="grid3">
          <div><label>X</label><input id="pdfXInput" type="number" step="0.01" value="0"></div>
          <div><label>Y</label><input id="pdfYInput" type="number" step="0.01" value="0"></div>
          <div><label>Z</label><input id="pdfZInput" type="number" step="0.01" value="0"></div>
        </div>

        <div class="grid2">
          <button class="btn lime" id="applyPdfBtn">PDF反映</button>
          <button class="btn" id="resetPdfPosBtn">位置リセット</button>
        </div>

        <div class="grid2">
          <button class="btn" id="togglePdfBtn">PDF表示/非表示</button>
          <button class="btn magenta" id="clearPdfBtn">PDF消去</button>
        </div>

        <div class="status" id="pdfStatus">PDF READY</div>
        <div class="mini">PDFはチャプター内の最初のPDFを自動読込します。例：teaching-contest/CH01/01.ベース筋.pdf</div>
      </div>
    </aside>

    <section class="playbar">
      <button class="btn" id="prevBottomBtn">前CH</button>
      <button class="btn lime" id="playPauseBtn">再生</button>
      <button class="btn" id="restartBtn">最初から</button>

      <div class="speedbox">
        <span class="mini">速度</span>
        <input id="speedRange" type="range" min="0.05" max="2.0" step="0.05" value="0.80">
        <span id="speedText">0.80x</span>
      </div>

      <select id="animationSelect" title="アニメーション">
        <option value="__ALL__">全Action</option>
      </select>
      <button class="btn" id="loopBtn">ループOFF</button>
      <button class="btn" id="nextBottomBtn">次CH</button>
      <button class="btn magenta" id="openArBtn">AR切替</button>
    </section>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

    const GITHUB_OWNER = "ASKR-created";
    const GITHUB_REPO = "ASKR-created.github.io";
    const GITHUB_REF = "main";

    const ROOT_CANDIDATES = [
      "teaching-contest",
      "teaching_contest",
      "teachingContest",
      "kyozai-contest",
      "kyozai_contest",
      "教材コンクール"
    ];

    const MODEL_EXTS = [".glb", ".gltf"];
    const PDF_EXTS = [".pdf", ".png", ".jpg", ".jpeg", ".webp"];

    const canvas = document.getElementById("viewer");

    const refbar = document.getElementById("refbar");
    const collapseRefBtn = document.getElementById("collapseRefBtn");
    const scanBtn = document.getElementById("scanBtn");
    const autoRootBtn = document.getElementById("autoRootBtn");
    const rootInput = document.getElementById("rootInput");
    const chapterSelect = document.getElementById("chapterSelect");
    const prevChapterBtn = document.getElementById("prevChapterBtn");
    const nextChapterBtn = document.getElementById("nextChapterBtn");

    const chapterNameText = document.getElementById("chapterNameText");
    const modelPathText = document.getElementById("modelPathText");
    const pdfPathText = document.getElementById("pdfPathText");
    const pdfNameText = document.getElementById("pdfNameText");

    const modelScaleInput = document.getElementById("modelScaleInput");
    const applyModelScaleBtn = document.getElementById("applyModelScaleBtn");
    const snapGroundBtn = document.getElementById("snapGroundBtn");
    const modelRotYInput = document.getElementById("modelRotYInput");
    const rotYMinusBtn = document.getElementById("rotYMinusBtn");
    const rotYPlusBtn = document.getElementById("rotYPlusBtn");
    const fitViewBtn = document.getElementById("fitViewBtn");
    const clearModelBtn = document.getElementById("clearModelBtn");
    const objectStatus = document.getElementById("objectStatus");

    const pdfPlacementSelect = document.getElementById("pdfPlacementSelect");
    const pdfPercentInput = document.getElementById("pdfPercentInput");
    const pdfOpacityInput = document.getElementById("pdfOpacityInput");
    const pdfXInput = document.getElementById("pdfXInput");
    const pdfYInput = document.getElementById("pdfYInput");
    const pdfZInput = document.getElementById("pdfZInput");
    const applyPdfBtn = document.getElementById("applyPdfBtn");
    const resetPdfPosBtn = document.getElementById("resetPdfPosBtn");
    const togglePdfBtn = document.getElementById("togglePdfBtn");
    const clearPdfBtn = document.getElementById("clearPdfBtn");
    const pdfStatus = document.getElementById("pdfStatus");

    const prevBottomBtn = document.getElementById("prevBottomBtn");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const speedRange = document.getElementById("speedRange");
    const speedText = document.getElementById("speedText");
    const animationSelect = document.getElementById("animationSelect");
    const loopBtn = document.getElementById("loopBtn");
    const nextBottomBtn = document.getElementById("nextBottomBtn");
    const openArBtn = document.getElementById("openArBtn");

    let chapters = [];
    let currentChapterIndex = -1;
    let currentRoot = "";
    let modelWrapper = null;
    let modelScene = null;
    let modelBaseScale = 1;
    let modelUserScale = 1;
    let modelSize = 2;
    let mixer = null;
    let clips = [];
    let actions = [];
    let isPlaying = false;
    let loopEnabled = false;
    let animSpeed = 0.8;
    let animElapsed = 0;
    let animDuration = 0;

    let pdfLayer = null;

    const params = new URLSearchParams(location.search);
    const initialRoot = params.get("root") ? decodeURIComponent(params.get("root")) : "";
    const initialChapter = params.get("chapter") ? decodeURIComponent(params.get("chapter")) : "";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030a);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 100000);
    camera.position.set(4, 3, 5);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias:true,
      alpha:false,
      powerPreference:"high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    scene.add(new THREE.HemisphereLight(0xddeeff,0x101018,1.55));

    const key = new THREE.DirectionalLight(0xffffff,2.0);
    key.position.set(4,8,6);
    key.castShadow = true;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x22f8ff,.75);
    fill.position.set(-5,2,-4);
    scene.add(fill);

    const magenta = new THREE.PointLight(0xff2deb,.75,18);
    magenta.position.set(-3,2.5,3);
    scene.add(magenta);

    const grid = new THREE.GridHelper(10,20,0x22f8ff,0x18324f);
    grid.material.transparent = true;
    grid.material.opacity = .22;
    scene.add(grid);

    const pdfRoot = new THREE.Group();
    scene.add(pdfRoot);

    const clock = new THREE.Clock();

    function setObjectStatus(text){
      objectStatus.textContent = text;
      console.log("[OBJECT]", text);
    }

    function setPdfStatus(text){
      pdfStatus.textContent = text;
      console.log("[PDF]", text);
    }

    function normalizePath(path){
      return String(path || "").trim().replace(/\\/g,"/").replace(/^\/+/,"").replace(/\/+$/,"");
    }

    function encodePath(path){
      return normalizePath(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return `${location.origin}/${encodePath(path)}`;
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function getBaseName(path){
      return String(path).split("/").pop() || path;
    }

    async function fetchGitHubContents(path){
      const safePath = path ? "/" + encodePath(path) : "";
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents${safePath}?ref=${encodeURIComponent(GITHUB_REF)}&_=${Date.now()}`;
      const res = await fetch(url, {headers:{"Accept":"application/vnd.github+json"}});
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${path || "/"}`);
      return await res.json();
    }

    async function scanChapter(chapterPath){
      const items = await fetchGitHubContents(chapterPath);
      const files = Array.isArray(items) ? items.filter(item => item.type === "file") : [];

      const model = files.find(f => MODEL_EXTS.includes(getExt(f.path))) || null;
      const pdf = files.find(f => PDF_EXTS.includes(getExt(f.path))) || null;

      return {
        name:getBaseName(chapterPath),
        path:chapterPath,
        model:model ? model.path : "",
        pdf:pdf ? pdf.path : "",
        files:files.map(f => f.path)
      };
    }

    async function scanRoot(root){
      root = normalizePath(root);
      const items = await fetchGitHubContents(root);
      const dirs = Array.isArray(items) ? items.filter(item => item.type === "dir") : [];
      const result = [];

      for (const d of dirs){
        const ch = await scanChapter(d.path);
        if (ch.model || ch.pdf) result.push(ch);
      }

      result.sort((a,b) => a.name.localeCompare(b.name, "ja"));
      return result;
    }

    async function autoDetectRoot(){
      for (const candidate of ROOT_CANDIDATES){
        try{
          const result = await scanRoot(candidate);
          if (result.length > 0){
            rootInput.value = candidate;
            chapters = result;
            currentRoot = candidate;
            populateChapters();
            setObjectStatus(`参照フォルダ検出: ${candidate} / ${result.length} chapters`);
            return true;
          }
        }catch(err){
          console.warn("root skipped:", candidate, err.message);
        }
      }

      setObjectStatus("参照フォルダが見つかりません。rootInputへ入力してください。");
      return false;
    }

    async function loadReferenceRoot(){
      const root = normalizePath(rootInput.value || "");
      if (!root){
        await autoDetectRoot();
        return;
      }

      try{
        chapters = await scanRoot(root);
        currentRoot = root;
        populateChapters();
        setObjectStatus(`参照読込: ${root} / ${chapters.length} chapters`);

        if (chapters.length > 0){
          let index = 0;
          if (initialChapter){
            const found = chapters.findIndex(ch => ch.name === initialChapter || ch.path.endsWith("/" + initialChapter));
            if (found >= 0) index = found;
          }
          await loadChapter(index);
        }
      }catch(err){
        console.error(err);
        setObjectStatus("参照読込失敗: " + err.message);
        alert("参照フォルダの読み込みに失敗しました。\n\n" + root + "\n\n" + err.message);
      }
    }

    function populateChapters(){
      chapterSelect.innerHTML = "";

      if (chapters.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "チャプターなし";
        chapterSelect.appendChild(opt);
        return;
      }

      for (let i=0; i<chapters.length; i++){
        const ch = chapters[i];
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${ch.name} / ${ch.model ? getBaseName(ch.model) : "modelなし"} / ${ch.pdf ? getBaseName(ch.pdf) : "PDFなし"}`;
        chapterSelect.appendChild(opt);
      }
    }

    async function loadChapter(index){
      if (index < 0 || index >= chapters.length) return;

      currentChapterIndex = index;
      const ch = chapters[index];
      chapterSelect.value = String(index);

      chapterNameText.textContent = ch.name;
      modelPathText.textContent = ch.model || "未登録";
      pdfPathText.textContent = ch.pdf || "未登録";
      pdfNameText.textContent = ch.pdf ? getBaseName(ch.pdf) : "未読込";

      if (ch.model) await loadModel(ch.model);
      else clearModel();

      if (ch.pdf) await loadPdf(ch.pdf);
      else clearPdf();

      updateUrlState();
      fitView();
    }

    function updateUrlState(){
      const url = new URL(location.href);
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (chapters[currentChapterIndex]) url.searchParams.set("chapter", chapters[currentChapterIndex].name);
      history.replaceState(null, "", url.toString());
    }

    function clearModel(){
      if (modelWrapper){
        scene.remove(modelWrapper);
        modelWrapper.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose?.();
          if (obj.material){
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach(mat => {
              for (const key in mat){
                if (mat[key] && mat[key].isTexture) mat[key].dispose?.();
              }
              mat.dispose?.();
            });
          }
        });
      }

      modelWrapper = null;
      modelScene = null;
      mixer = null;
      clips = [];
      actions = [];
      isPlaying = false;
      playPauseBtn.textContent = "再生";
      updateAnimationSelect();
      setObjectStatus("モデル消去");
    }

    async function loadModel(path){
      clearModel();

      const loader = new GLTFLoader();
      const url = toAssetUrl(path);

      try{
        setObjectStatus("MODEL LOADING: " + path);
        const gltf = await loader.loadAsync(url);

        modelScene = gltf.scene || gltf.scenes[0];
        clips = gltf.animations || [];

        modelWrapper = new THREE.Group();
        modelWrapper.name = "TEACHING_CHAPTER_MODEL_WRAPPER";
        modelWrapper.add(modelScene);
        scene.add(modelWrapper);

        const box = new THREE.Box3().setFromObject(modelScene);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        modelBaseScale = 2.0 / maxDim;
        modelUserScale = parseFloat(modelScaleInput.value) || 1;
        modelSize = maxDim * modelBaseScale * modelUserScale;

        modelWrapper.scale.setScalar(modelBaseScale * modelUserScale);
        modelWrapper.position.set(
          -center.x * modelBaseScale * modelUserScale,
          -box.min.y * modelBaseScale * modelUserScale,
          -center.z * modelBaseScale * modelUserScale
        );

        const rotY = THREE.MathUtils.degToRad(parseFloat(modelRotYInput.value) || 0);
        modelWrapper.rotation.y = rotY;

        if (clips.length > 0){
          mixer = new THREE.AnimationMixer(modelScene);
          actions = clips.map(clip => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            return action;
          });
          animDuration = Math.max(...clips.map(c => c.duration || 0), 0);
        }

        updateAnimationSelect();
        setObjectStatus(`読込完了: ${path} / Action ${clips.length}`);
      }catch(err){
        console.error(err);
        setObjectStatus("MODEL LOAD ERROR");
        alert("モデルの読み込みに失敗しました。\n\n" + path + "\n\n" + err.message);
      }
    }

    function updateAnimationSelect(){
      animationSelect.innerHTML = "";
      const all = document.createElement("option");
      all.value = "__ALL__";
      all.textContent = clips.length ? "全Action" : "アニメーションなし";
      animationSelect.appendChild(all);

      clips.forEach((clip, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = clip.name || `Action ${i+1}`;
        animationSelect.appendChild(opt);
      });
    }

    function playAnimation(restart=false){
      if (!mixer || actions.length === 0){
        setObjectStatus("アニメーションなし");
        return;
      }

      if (restart){
        mixer.stopAllAction();
        animElapsed = 0;
      }

      const selected = animationSelect.value;
      const targets = selected === "__ALL__" ? actions : [actions[parseInt(selected,10)]].filter(Boolean);

      if (restart || !isPlaying){
        for (const action of targets){
          action.enabled = true;
          action.paused = false;
          action.reset();
          action.setEffectiveTimeScale(1);
          action.setEffectiveWeight(1);
          action.play();
        }
      } else {
        for (const action of targets){
          action.paused = false;
          action.play();
        }
      }

      isPlaying = true;
      playPauseBtn.textContent = "一時停止";
      setObjectStatus("ANIMATION PLAY");
    }

    function pauseAnimation(){
      actions.forEach(a => a.paused = true);
      isPlaying = false;
      playPauseBtn.textContent = "再生";
      setObjectStatus("ANIMATION PAUSE");
    }

    function restartAnimation(){
      playAnimation(true);
    }

    function applyModelTransform(){
      if (!modelWrapper || !modelScene) return;

      modelUserScale = parseFloat(modelScaleInput.value) || 1;
      modelWrapper.scale.setScalar(modelBaseScale * modelUserScale);

      const box = new THREE.Box3().setFromObject(modelScene);
      const center = new THREE.Vector3();
      box.getCenter(center);

      modelWrapper.position.x = -center.x * modelBaseScale * modelUserScale;
      modelWrapper.position.z = -center.z * modelBaseScale * modelUserScale;

      snapModelGround();

      const rotY = THREE.MathUtils.degToRad(parseFloat(modelRotYInput.value) || 0);
      modelWrapper.rotation.y = rotY;

      modelSize = 2.0 * modelUserScale;
      setObjectStatus(`モデル変形反映 / scale ${modelUserScale}`);
      fitView();
      if (pdfLayer) applyPdfTransform();
    }

    function snapModelGround(){
      if (!modelWrapper) return;
      const box = new THREE.Box3().setFromObject(modelWrapper);
      if (box.isEmpty()) return;
      modelWrapper.position.y += -box.min.y;
      setObjectStatus("モデルを地面Y=0へ配置");
    }

    function clearPdf(){
      if (pdfLayer){
        pdfRoot.remove(pdfLayer.group);
        pdfLayer.texture.dispose?.();
        pdfLayer.material.dispose?.();
        pdfLayer.mesh.geometry.dispose?.();
      }
      pdfLayer = null;
      pdfNameText.textContent = "未読込";
      setPdfStatus("PDF消去");
    }

    async function renderPdfToCanvas(path){
      const ext = getExt(path);
      const url = toAssetUrl(path);

      if (ext === ".pdf"){
        const task = pdfjsLib.getDocument(url);
        const pdf = await task.promise;
        const page = await pdf.getPage(1);
        const base = page.getViewport({scale:1});
        const maxSide = 2048;
        const scale = Math.min(2.2, maxSide / Math.max(base.width, base.height));
        const viewport = page.getViewport({scale});
        const canvas2d = document.createElement("canvas");
        canvas2d.width = Math.max(1, Math.floor(viewport.width));
        canvas2d.height = Math.max(1, Math.floor(viewport.height));
        const ctx = canvas2d.getContext("2d", {alpha:false});
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
        await page.render({canvasContext:ctx, viewport}).promise;
        return canvas2d;
      }

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      await img.decode();

      const canvas2d = document.createElement("canvas");
      canvas2d.width = img.naturalWidth;
      canvas2d.height = img.naturalHeight;
      const ctx = canvas2d.getContext("2d", {alpha:false});
      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
      ctx.drawImage(img,0,0);
      return canvas2d;
    }

    async function loadPdf(path){
      clearPdf();

      try{
        setPdfStatus("PDF LOADING: " + path);
        const canvas2d = await renderPdfToCanvas(path);
        const texture = new THREE.CanvasTexture(canvas2d);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const material = new THREE.MeshBasicMaterial({
          map:texture,
          transparent:true,
          opacity:parseFloat(pdfOpacityInput.value) || 0.65,
          side:THREE.DoubleSide,
          depthWrite:false
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), material);
        const group = new THREE.Group();
        group.add(mesh);
        pdfRoot.add(group);

        pdfLayer = {
          path,
          aspect: canvas2d.width / Math.max(1, canvas2d.height),
          texture,
          material,
          mesh,
          group,
          visible:true
        };

        pdfNameText.textContent = getBaseName(path);
        applyPdfTransform();
        setPdfStatus("PDF読込完了: " + path);
      }catch(err){
        console.error(err);
        setPdfStatus("PDF LOAD ERROR");
        alert("PDFの読み込みに失敗しました。\n\n" + path + "\n\n" + err.message);
      }
    }

    function applyPdfTransform(){
      if (!pdfLayer) return;

      const percent = Math.max(1, parseFloat(pdfPercentInput.value) || 100);
      const opacity = Math.max(0.05, Math.min(1, parseFloat(pdfOpacityInput.value) || 0.65));
      const width = Math.max(2.5, modelSize * 3.5) * percent / 100;
      const height = width / Math.max(0.001, pdfLayer.aspect);

      pdfLayer.mesh.geometry.dispose();
      pdfLayer.mesh.geometry = new THREE.PlaneGeometry(width, height);
      pdfLayer.material.opacity = opacity;
      pdfLayer.group.visible = pdfLayer.visible;

      const x = parseFloat(pdfXInput.value) || 0;
      const y = parseFloat(pdfYInput.value) || 0;
      const z = parseFloat(pdfZInput.value) || 0;

      if (pdfPlacementSelect.value === "floor"){
        pdfLayer.group.position.set(x, -0.01 + y, z);
        pdfLayer.group.rotation.set(-Math.PI/2, 0, 0);
      } else {
        pdfLayer.group.position.set(x, height/2 + y, -height/2 + z);
        pdfLayer.group.rotation.set(0, 0, 0);
      }

      setPdfStatus(`PDF反映: ${pdfPlacementSelect.value} / ${percent}% / opacity ${opacity}`);
    }

    function fitView(){
      const box = new THREE.Box3();
      if (modelWrapper) box.expandByObject(modelWrapper);
      if (pdfLayer && pdfLayer.group.visible) box.expandByObject(pdfLayer.group);

      if (box.isEmpty()){
        camera.position.set(4,3,5);
        controls.target.set(0,0,0);
        controls.update();
        return;
      }

      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x,size.y,size.z) || 2;
      const dist = maxDim * 1.8;

      controls.target.copy(center);
      camera.position.set(center.x + dist, center.y + dist * 0.7, center.z + dist);
      camera.near = Math.max(0.001, maxDim / 1000);
      camera.far = Math.max(1000, maxDim * 1000);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function changeChapter(delta){
      if (chapters.length === 0) return;
      let next = currentChapterIndex + delta;
      if (next < 0) next = chapters.length - 1;
      if (next >= chapters.length) next = 0;
      loadChapter(next);
    }

    function openArViewer(){
      const ch = chapters[currentChapterIndex];
      const url = new URL(location.origin + location.pathname.replace(/\/[^\/]*$/, "/ar.html"));
      url.searchParams.set("v", "20260605_0002_v24");
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (ch) url.searchParams.set("chapter", ch.name);
      window.open(url.toString(), "_blank");
    }

    function resize(){
      const w = canvas.clientWidth || window.innerWidth;
      const h = canvas.clientHeight || window.innerHeight;
      camera.aspect = w / Math.max(1,h);
      camera.updateProjectionMatrix();
      renderer.setSize(w,h,false);
    }

    function animate(){
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer && isPlaying){
        mixer.update(delta * animSpeed);
        animElapsed += delta * animSpeed;

        const selected = animationSelect.value;
        const duration = selected === "__ALL__"
          ? animDuration
          : (clips[parseInt(selected,10)] ? clips[parseInt(selected,10)].duration : animDuration);

        if (duration > 0 && animElapsed >= duration){
          if (loopEnabled){
            restartAnimation();
          } else {
            pauseAnimation();
          }
        }
      }

      controls.update();
      renderer.render(scene,camera);
    }

    collapseRefBtn.addEventListener("click", () => {
      refbar.classList.toggle("collapsed");
      collapseRefBtn.textContent = refbar.classList.contains("collapsed") ? "参照フォルダ展開" : "参照フォルダ収納";
    });

    scanBtn.addEventListener("click", loadReferenceRoot);
    autoRootBtn.addEventListener("click", autoDetectRoot);
    chapterSelect.addEventListener("change", () => loadChapter(parseInt(chapterSelect.value,10)));
    prevChapterBtn.addEventListener("click", () => changeChapter(-1));
    nextChapterBtn.addEventListener("click", () => changeChapter(1));
    prevBottomBtn.addEventListener("click", () => changeChapter(-1));
    nextBottomBtn.addEventListener("click", () => changeChapter(1));

    applyModelScaleBtn.addEventListener("click", applyModelTransform);
    snapGroundBtn.addEventListener("click", () => { snapModelGround(); fitView(); });
    rotYMinusBtn.addEventListener("click", () => {
      modelRotYInput.value = String((parseFloat(modelRotYInput.value) || 0) - 90);
      applyModelTransform();
    });
    rotYPlusBtn.addEventListener("click", () => {
      modelRotYInput.value = String((parseFloat(modelRotYInput.value) || 0) + 90);
      applyModelTransform();
    });
    fitViewBtn.addEventListener("click", fitView);
    clearModelBtn.addEventListener("click", clearModel);

    applyPdfBtn.addEventListener("click", () => { applyPdfTransform(); fitView(); });
    resetPdfPosBtn.addEventListener("click", () => {
      pdfXInput.value = "0";
      pdfYInput.value = "0";
      pdfZInput.value = "0";
      applyPdfTransform();
    });
    togglePdfBtn.addEventListener("click", () => {
      if (!pdfLayer) return;
      pdfLayer.visible = !pdfLayer.visible;
      pdfLayer.group.visible = pdfLayer.visible;
    });
    clearPdfBtn.addEventListener("click", clearPdf);
    pdfPlacementSelect.addEventListener("change", () => { applyPdfTransform(); fitView(); });

    playPauseBtn.addEventListener("click", () => {
      if (isPlaying) pauseAnimation();
      else playAnimation(false);
    });
    restartBtn.addEventListener("click", restartAnimation);

    speedRange.addEventListener("input", () => {
      animSpeed = parseFloat(speedRange.value) || 0.8;
      speedText.textContent = animSpeed.toFixed(2) + "x";
    });

    loopBtn.addEventListener("click", () => {
      loopEnabled = !loopEnabled;
      loopBtn.textContent = loopEnabled ? "ループON" : "ループOFF";
      loopBtn.classList.toggle("lime", loopEnabled);
    });

    animationSelect.addEventListener("change", restartAnimation);
    openArBtn.addEventListener("click", openArViewer);

    window.addEventListener("resize", resize);

    if (initialRoot) rootInput.value = initialRoot;

    resize();
    animate();
    loadReferenceRoot();
  </script>
</body>
