<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF AR Viewer - Teaching Contest v51 Size Stable Reset</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs"></script>

  <style>
    :root{
      --panel:rgba(8,16,32,.88);
      --cyan:#22f8ff;
      --lime:#a6ff2d;
      --magenta:#ff2deb;
      --text:#eafbff;
      --sub:#96a8c8;
      --line:rgba(34,248,255,.34);
      --shadow:0 0 18px rgba(34,248,255,.18),0 0 30px rgba(255,45,235,.08);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(34,248,255,.10), transparent 28%),
        radial-gradient(circle at 86% 76%, rgba(255,45,235,.10), transparent 32%),
        linear-gradient(135deg,#02030a,#061020 58%,#050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:50;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,248,255,.022) 1px,transparent 1px);
      background-size:4px 4px,18px 18px;
      mix-blend-mode:screen;
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .storage-check{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:0;
      height:0;
    }

    .storage-label{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
      white-space:nowrap;
      user-select:none;
    }

    .storage-label:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    .storage-label .closed{
      display:none;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf,
    #focusViewer:checked ~ .refbar .storage-label.focus{
      border-color:rgba(166,255,45,.62)!important;
      color:var(--lime)!important;
      box-shadow:0 0 16px rgba(166,255,45,.16)!important;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object .opened,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf .opened,
    #focusViewer:checked ~ .refbar .storage-label.focus .opened{
      display:none;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object .closed,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf .closed,
    #focusViewer:checked ~ .refbar .storage-label.focus .closed{
      display:inline;
    }

    #hideObjectSide:checked ~ #objectSide,
    #hidePdfSide:checked ~ #pdfSide,
    #focusViewer:checked ~ #objectSide,
    #focusViewer:checked ~ #pdfSide{
      display:none!important;
    }

    model-viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:transparent;
      --poster-color:transparent;
      --progress-bar-color:#22f8ff;
      --progress-bar-height:3px;
    }

    .refbar{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:20;
      border:1px solid var(--line);
      background:linear-gradient(90deg,rgba(8,16,32,.86),rgba(12,28,56,.64));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
    }

    .refbar-head{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      min-height:48px;
    }

    .rgb-line{
      height:3px;
      margin-bottom:6px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.60);
    }

    .title{
      font-size:17px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .subtitle{
      margin-top:3px;
      color:var(--sub);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .refbar-body{
      display:grid;
      grid-template-columns:1.4fr auto 1fr auto auto;
      gap:8px;
      padding:0 12px 10px;
      align-items:end;
    }

    .refbar.collapsed .refbar-body{
      display:none;
    }


    .side-storage-bar{
      position:absolute;
      top:76px;
      left:50%;
      transform:translateX(-50%);
      z-index:23;
      width:min(760px,calc(100vw - 20px));
      min-height:44px;
      border:1px solid rgba(34,248,255,.34);
      background:rgba(4,10,20,.84);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      padding:6px;
    }

    .side-storage-bar .storage-label{
      min-height:32px;
      font-size:12px;
    }

    .side{
      position:absolute;
      top:128px;
      bottom:86px;
      width:min(340px,calc(50vw - 18px));
      z-index:12;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .side.left{left:10px}
    .side.right{right:10px}

    .side-head{
      padding:10px 12px;
      border-bottom:1px solid rgba(34,248,255,.20);
      background:linear-gradient(90deg,rgba(34,248,255,.10),rgba(255,45,235,.07));
      color:var(--cyan);
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .side-body{
      padding:10px;
      overflow:auto;
      min-height:0;
      flex:1 1 auto;
    }

    .playbar{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:22;
      min-height:66px;
      border:1px solid var(--line);
      background:rgba(4,10,20,.84);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:auto auto 1fr auto auto auto;
      gap:8px;
      align-items:center;
      padding:8px;
    }

    .speedbox{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      align-items:center;
      min-width:260px;
    }

    button,.btn{
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
    }

    button:hover,.btn:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    button.lime,.btn.lime{
      border-color:rgba(166,255,45,.52);
      color:var(--lime);
    }

    button.magenta,.btn.magenta{
      border-color:rgba(255,45,235,.52);
      color:#ffd4fb;
    }

    input,select{
      width:100%;
      min-height:34px;
      border:1px solid rgba(34,248,255,.35);
      background:rgba(1,5,14,.88);
      color:var(--text);
      padding:6px 8px;
      outline:none;
      font-size:13px;
    }

    input[type="range"]{
      accent-color:var(--lime);
      padding:0;
    }

    label{
      color:var(--sub);
      font-size:11px;
      display:block;
      margin:8px 0 3px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .status{
      margin-top:8px;
      border:1px solid rgba(166,255,45,.26);
      background:rgba(166,255,45,.045);
      color:var(--lime);
      padding:8px;
      font-size:12px;
      line-height:1.45;
      word-break:break-all;
      font-family:Consolas,"MS UI Gothic",monospace;
    }

    .info-row{
      display:grid;
      grid-template-columns:86px 1fr;
      gap:8px;
      padding:5px 0;
      border-bottom:1px solid rgba(34,248,255,.08);
      font-size:12px;
    }

    .info-row .k{color:var(--sub)}
    .info-row .v{word-break:break-all}

    .pdf-preview{
      width:100%;
      aspect-ratio:1.414/1;
      object-fit:contain;
      background:white;
      border:1px solid rgba(34,248,255,.35);
      margin-top:8px;
      opacity:.85;
      transform-origin:top left;
    }

    .ar-button{
      position:absolute;
      left:50%;
      bottom:96px;
      transform:translateX(-50%);
      z-index:18;
      min-width:min(420px,calc(100vw - 48px));
      min-height:54px;
      border:2px solid rgba(166,255,45,.72);
      background:linear-gradient(180deg,rgba(24,48,18,.92),rgba(4,14,8,.94));
      color:var(--lime);
      font-size:18px;
      font-weight:bold;
      letter-spacing:.10em;
      box-shadow:0 0 22px rgba(166,255,45,.22);
      cursor:pointer;
    }

    .mobile-dock,
    .mobile-quick-panel{
      display:none;
    }

    @media (max-width:980px){
      html,body{overflow:hidden;height:100%}

      #app{
        position:fixed;
        inset:0;
        height:100dvh;
        min-height:0;
        overflow:hidden;
        padding:0;
        background:#02030a;
      }

      model-viewer{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        min-height:0;
        border:none;
        margin:0;
      }

      .refbar,.side-storage-bar,.side,.playbar{display:none}

      .refbar.mobile-open,
      .side.mobile-open,
      .playbar.mobile-open{
        display:flex;
        position:absolute;
        left:8px;
        right:8px;
        top:72px;
        bottom:76px;
        width:auto;
        max-height:none;
        margin:0;
        transform:none;
        z-index:45;
        overflow:auto;
      }

      .refbar.mobile-open{
        display:block;
        bottom:auto;
        max-height:58dvh;
        clip-path:none;
      }

      .refbar.mobile-open .refbar-head{grid-template-columns:1fr}
      .refbar.mobile-open .refbar-body{grid-template-columns:1fr}
      .side.mobile-open{display:flex}

      .playbar.mobile-open{
        display:grid;
        top:auto;
        bottom:76px;
        min-height:0;
        grid-template-columns:1fr 1fr;
        align-items:stretch;
      }

      .playbar.mobile-open .speedbox,
      .playbar.mobile-open select{
        grid-column:1/-1;
        min-width:0;
      }

      .ar-button{display:none}

      .mobile-dock{
        display:grid;
        position:absolute;
        left:8px;
        right:8px;
        bottom:8px;
        z-index:60;
        grid-template-columns:repeat(4,1fr);
        gap:6px;
        padding:6px;
        border:1px solid rgba(34,248,255,.34);
        background:rgba(4,10,20,.88);
        box-shadow:var(--shadow);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
      }

      .mobile-dock button{
        min-height:44px;
        padding:0 4px;
        font-size:11px;
        letter-spacing:0;
      }

      .mobile-quick-panel{
        display:none;
        position:absolute;
        left:8px;
        right:8px;
        bottom:76px;
        z-index:58;
        border:1px solid rgba(34,248,255,.34);
        background:rgba(4,10,20,.93);
        box-shadow:var(--shadow);
        padding:8px;
        grid-template-columns:repeat(2,1fr);
        gap:8px;
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
      }

      .mobile-quick-panel.mobile-open{display:grid}
      .mobile-quick-panel button{min-height:42px;font-size:12px}
      .title{font-size:13px}
    }
  </style>
</head>
<body>
  <div id="app">
    <input class="storage-check" type="checkbox" id="hideObjectSide">
    <input class="storage-check" type="checkbox" id="hidePdfSide">
    <input class="storage-check" type="checkbox" id="focusViewer">
    <model-viewer
      id="viewer"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="0.75"
      exposure="1.1"
      ar
      ar-modes="quick-look scene-viewer webxr"
      ar-scale="fixed"
      ar-placement="floor"
      scale="1 1 1"
      autoplay
      camera-orbit="25deg 70deg 130%"
      min-camera-orbit="auto auto 80%"
      max-camera-orbit="auto auto 500%"
    >
      <button slot="ar-button" class="ar-button" id="nativeArButton">ARで見る</button>
    </model-viewer>

    <section class="refbar" id="refbar">
      <div class="refbar-head">
        <div>
          <div class="rgb-line"></div>
          <div class="title">SF AR VIEWER / TEACHING CONTEST v51</div>
          <div class="subtitle">サイズ安定版 / スマホ4ボタン構成 / PDF1-20→1-70固定</div>
        </div>
        <button class="btn" id="collapseRefBtn">参照フォルダ収納</button>
        <button class="btn lime" id="scanBtn">参照読込</button>
      </div>

      <div class="refbar-body">
        <div>
          <label>参照フォルダ</label>
          <input id="rootInput" value="teaching-contest" placeholder="teaching-contest または 教材コンクール">
        </div>
        <button class="btn" id="autoRootBtn">自動検出</button>
        <div>
          <label>チャプターフォルダ</label>
          <select id="chapterSelect">
            <option value="">未読込</option>
          </select>
        </div>
        <button class="btn" id="prevChapterBtn">前CH</button>
        <button class="btn" id="nextChapterBtn">次CH</button>
      </div>
    </section>

    <section class="side-storage-bar" id="sideStorageBar">
      <label class="storage-label object" for="hideObjectSide">
        <span class="opened">左サイドバー収納</span>
        <span class="closed">左サイドバー展開</span>
      </label>
      <label class="storage-label pdf" for="hidePdfSide">
        <span class="opened">右サイドバー収納</span>
        <span class="closed">右サイドバー展開</span>
      </label>
      <label class="storage-label focus" for="focusViewer">
        <span class="opened">表示優先</span>
        <span class="closed">操作パネル復帰</span>
      </label>
    </section>

    <aside class="side left" id="objectSide">
      <div class="side-head">OBJECT OPERATION</div>
      <div class="side-body">
        <div class="info-row"><div class="k">CHAPTER</div><div class="v" id="chapterNameText">未選択</div></div>
        <div class="info-row"><div class="k">MODEL</div><div class="v" id="modelPathText">未読込</div></div>

        <div class="grid2">
          <button class="btn lime" id="arStartBtn">ARで見る</button>
          <button class="btn" id="resetViewBtn">視点リセット</button>
        </div>

        <div class="grid2">
          <button class="btn" id="modelUrlBtn">モデルURL表示</button>
          <button class="btn magenta" id="clearModelBtn">モデル消去</button>
        </div>

        <label>CH01基準モデル補正</label>
        <div class="grid2">
          <button class="btn" id="chapterCorrectionBtn">モデル補正OFF</button>
          <button class="btn" id="chapterCorrectionApplyBtn">補正再反映</button>
        </div>
        <div class="status" id="chapterCorrectionStatus">CH01基準モデル補正: 待機中</div>

        <div class="status" id="objectStatus">OBJECT READY</div>
      </div>
    </aside>

    <aside class="side right" id="pdfSide">
      <div class="side-head">PDF OPERATION</div>
      <div class="side-body">
        <div class="info-row"><div class="k">床PDF</div><div class="v" id="pdfFloorPathText">未読込</div></div>
        <img id="pdfFloorPreview" class="pdf-preview" alt="floor PDF preview">

        <div class="info-row"><div class="k">側面PDF</div><div class="v" id="pdfSidePathText">未読込</div></div>
        <img id="pdfSidePreview" class="pdf-preview" alt="side PDF preview">

        <div class="status" id="pdfScaleReadout">縮尺換算: 未設定</div>

        <div class="grid2">
          <div>
            <label>取り込んだPDFの縮尺 1/</label>
            <input id="pdfCurrentScaleInput" type="number" min="1" step="1" value="20">
          </div>
          <div>
            <label>変更したい縮尺 1/</label>
            <input id="pdfTargetScaleInput" type="number" min="1" step="1" value="70">
          </div>
        </div>

        <div class="grid2">
          <button class="btn lime" id="applyPdfScaleBtn">縮尺反映</button>
          <button class="btn" id="resetPdfScaleBtn">縮尺初期化</button>
        </div>

        <div class="status" id="pdfStatus">PDF READY</div>
        <div class="status">PDFが2つある場合は、床PDFと側面PDFとしてプレビューします。実ARへ渡すのはGLB/GLTFモデルです。</div>
      </div>
    </aside>

    <section class="playbar">
      <button class="btn" id="prevBottomBtn">前CH</button>
      <button class="btn lime" id="playPauseBtn">再生</button>
      <button class="btn" id="restartBtn">最初から</button>

      <div class="speedbox">
        <span>速度</span>
        <input id="speedRange" type="range" min="0.05" max="2.0" step="0.05" value="0.80">
        <span id="speedText">0.80x</span>
      </div>

      <select id="animationSelect">
        <option value="">アニメーションなし</option>
      </select>
      <button class="btn magenta" id="back3dBtn">3Dへ戻る</button>
    </section>

    <section class="mobile-quick-panel" id="mobileQuickPanel">
      <button class="btn lime" id="mobileArBtn">AR起動</button>
      <button class="btn" id="mobileOpenRefBtn">CH選択</button>
      <button class="btn" id="mobileResetViewBtn">視点リセット</button>
      <button class="btn magenta" id="mobileBack3dBtn">3Dへ戻る</button>
      <button class="btn" id="mobileOpenObjectBtn">詳細</button>
      <button class="btn magenta" id="mobileClosePanelsBtn">閉じる</button>
    </section>

    <section class="mobile-dock" id="mobileDock">
      <button class="btn" id="mobilePrevBtn">前</button>
      <button class="btn lime" id="mobilePlayBtn">再生</button>
      <button class="btn" id="mobileNextBtn">次</button>
      <button class="btn magenta" id="mobilePanelBtn">メニュー</button>
    </section>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

    const GITHUB_OWNER = "ASKR-created";
    const GITHUB_REPO = "ASKR-created.github.io";
    const GITHUB_REF = "main";

    const ROOT_CANDIDATES = [
      "teaching-contest",
      "teaching_contest",
      "teachingContest",
      "kyozai-contest",
      "kyozai_contest",
      "教材コンクール"
    ];

    const MODEL_EXTS = [".glb", ".gltf", ".usdz"];
    const PDF_EXTS = [".pdf", ".png", ".jpg", ".jpeg", ".webp"];

    const viewer = document.getElementById("viewer");
    const refbar = document.getElementById("refbar");
    const collapseRefBtn = document.getElementById("collapseRefBtn");
    const scanBtn = document.getElementById("scanBtn");
    const autoRootBtn = document.getElementById("autoRootBtn");
    const rootInput = document.getElementById("rootInput");
    const chapterSelect = document.getElementById("chapterSelect");
    const prevChapterBtn = document.getElementById("prevChapterBtn");
    const nextChapterBtn = document.getElementById("nextChapterBtn");
    const chapterNameText = document.getElementById("chapterNameText");
    const modelPathText = document.getElementById("modelPathText");
    const pdfFloorPathText = document.getElementById("pdfFloorPathText");
    const pdfSidePathText = document.getElementById("pdfSidePathText");
    const pdfFloorPreview = document.getElementById("pdfFloorPreview");
    const pdfSidePreview = document.getElementById("pdfSidePreview");
    const pdfScaleReadout = document.getElementById("pdfScaleReadout");
    const pdfCurrentScaleInput = document.getElementById("pdfCurrentScaleInput");
    const pdfTargetScaleInput = document.getElementById("pdfTargetScaleInput");
    const applyPdfScaleBtn = document.getElementById("applyPdfScaleBtn");
    const resetPdfScaleBtn = document.getElementById("resetPdfScaleBtn");
    const objectStatus = document.getElementById("objectStatus");
    const pdfStatus = document.getElementById("pdfStatus");
    const arStartBtn = document.getElementById("arStartBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const modelUrlBtn = document.getElementById("modelUrlBtn");
    const clearModelBtn = document.getElementById("clearModelBtn");
    const chapterCorrectionBtn = document.getElementById("chapterCorrectionBtn");
    const chapterCorrectionApplyBtn = document.getElementById("chapterCorrectionApplyBtn");
    const chapterCorrectionStatus = document.getElementById("chapterCorrectionStatus");
    const prevBottomBtn = document.getElementById("prevBottomBtn");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const speedRange = document.getElementById("speedRange");
    const speedText = document.getElementById("speedText");
    const animationSelect = document.getElementById("animationSelect");
    const back3dBtn = document.getElementById("back3dBtn");

    const mobileQuickPanel = document.getElementById("mobileQuickPanel");
    const mobilePrevBtn = document.getElementById("mobilePrevBtn");
    const mobilePlayBtn = document.getElementById("mobilePlayBtn");
    const mobileNextBtn = document.getElementById("mobileNextBtn");
    const mobileArBtn = document.getElementById("mobileArBtn");
    const mobilePanelBtn = document.getElementById("mobilePanelBtn");
    const mobileBack3dBtn = document.getElementById("mobileBack3dBtn");
    const mobileOpenRefBtn = document.getElementById("mobileOpenRefBtn");
    const mobileOpenObjectBtn = document.getElementById("mobileOpenObjectBtn");
    const mobileResetViewBtn = document.getElementById("mobileResetViewBtn");
    const mobileClosePanelsBtn = document.getElementById("mobileClosePanelsBtn");

    let chapters = [];
    let currentChapterIndex = -1;
    let currentRoot = "";
    let currentModel = "";
    let playSpeed = 0.8;
    let isPaused = false;

    let chapterCorrectionEnabled = false;
    let chapterCorrectionFactor = 1.0;
    const CHAPTER_BASELINE_TARGET_SCALE = 70;
    const CHAPTER_TARGET_SCALE_MAP = {
      "CH01": 70,
      "CH02": 78
    };

    const params = new URLSearchParams(location.search);
    const initialRoot = params.get("root") ? decodeURIComponent(params.get("root")) : "";
    const initialChapter = params.get("chapter") ? decodeURIComponent(params.get("chapter")) : "";

    function setObjectStatus(text){
      objectStatus.textContent = text;
      console.log("[OBJECT]", text);
    }

    function setPdfStatus(text){
      pdfStatus.textContent = text;
      console.log("[PDF]", text);
    }

    function normalizePath(path){
      return String(path || "").trim().replace(/\\/g,"/").replace(/^\/+/,"").replace(/\/+$/,"");
    }

    function encodePath(path){
      return normalizePath(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return `${location.origin}/${encodePath(path)}`;
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function getBaseName(path){
      return String(path).split("/").pop() || path;
    }

    async function fetchGitHubContents(path){
      const safePath = path ? "/" + encodePath(path) : "";
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents${safePath}?ref=${encodeURIComponent(GITHUB_REF)}&_=${Date.now()}`;
      const res = await fetch(url, {headers:{"Accept":"application/vnd.github+json"}});
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${path || "/"}`);
      return await res.json();
    }

    function pdfRoleScore(path, role){
      const name = getBaseName(path).toLowerCase();

      if (role === "floor"){
        if (name.includes("平面") || name.includes("床") || name.includes("floor") || name.includes("ground") || name.includes("plan")) return 100;
        if (name.includes("base") || name.includes("ベース")) return 50;
        return 0;
      }

      if (role === "side"){
        if (name.includes("側面") || name.includes("立面") || name.includes("壁") || name.includes("side") || name.includes("wall") || name.includes("elevation")) return 100;
        return 0;
      }

      return 0;
    }

    function chooseFloorAndSidePdfs(pdfFiles){
      const pdfs = [...pdfFiles].sort((a,b) => a.path.localeCompare(b.path, "ja"));
      if (pdfs.length === 0) return { floorPdf:"", sidePdf:"", pdfs:[] };

      let floor = pdfs[0];
      let side = pdfs.length >= 2 ? pdfs[1] : null;

      const floorCandidate = [...pdfs].sort((a,b) => pdfRoleScore(b.path, "floor") - pdfRoleScore(a.path, "floor"))[0];
      if (floorCandidate && pdfRoleScore(floorCandidate.path, "floor") > 0) floor = floorCandidate;

      const sideCandidate = [...pdfs]
        .filter(p => p.path !== floor.path)
        .sort((a,b) => pdfRoleScore(b.path, "side") - pdfRoleScore(a.path, "side"))[0];

      if (sideCandidate && (pdfRoleScore(sideCandidate.path, "side") > 0 || pdfs.length >= 2)) side = sideCandidate;

      return {
        floorPdf: floor ? floor.path : "",
        sidePdf: side ? side.path : "",
        pdfs: pdfs.map(p => p.path)
      };
    }

    async function scanChapter(chapterPath){
      const items = await fetchGitHubContents(chapterPath);
      const files = Array.isArray(items) ? items.filter(item => item.type === "file") : [];
      const model = files.find(f => MODEL_EXTS.includes(getExt(f.path))) || null;
      const pdfFiles = files.filter(f => PDF_EXTS.includes(getExt(f.path)));
      const chosen = chooseFloorAndSidePdfs(pdfFiles);

      return {
        name:getBaseName(chapterPath),
        path:chapterPath,
        model:model ? model.path : "",
        pdf:chosen.floorPdf,
        floorPdf:chosen.floorPdf,
        sidePdf:chosen.sidePdf,
        pdfs:chosen.pdfs,
        files:files.map(f => f.path)
      };
    }

    async function scanRoot(root){
      root = normalizePath(root);
      const items = await fetchGitHubContents(root);
      const dirs = Array.isArray(items) ? items.filter(item => item.type === "dir") : [];
      const result = [];

      for (const d of dirs){
        const ch = await scanChapter(d.path);
        if (ch.model || ch.pdf) result.push(ch);
      }

      result.sort((a,b) => a.name.localeCompare(b.name, "ja"));
      return result;
    }

    async function autoDetectRoot(){
      for (const candidate of ROOT_CANDIDATES){
        try{
          const result = await scanRoot(candidate);
          if (result.length > 0){
            rootInput.value = candidate;
            chapters = result;
            currentRoot = candidate;
            populateChapters();
            setObjectStatus(`参照フォルダ検出: ${candidate}`);
            return true;
          }
        }catch(err){
          console.warn("root skipped:", candidate, err.message);
        }
      }

      setObjectStatus("参照フォルダが見つかりません。");
      return false;
    }

    async function loadReferenceRoot(){
      const root = normalizePath(rootInput.value || "");
      if (!root){
        await autoDetectRoot();
        return;
      }

      try{
        chapters = await scanRoot(root);
        currentRoot = root;
        populateChapters();
        setObjectStatus(`参照読込: ${root} / ${chapters.length} chapters`);

        if (chapters.length > 0){
          let index = 0;
          if (initialChapter){
            const found = chapters.findIndex(ch => ch.name === initialChapter || ch.path.endsWith("/" + initialChapter));
            if (found >= 0) index = found;
          }
          await loadChapter(index);
        }
      }catch(err){
        console.error(err);
        setObjectStatus("参照読込失敗: " + err.message);
        alert("参照フォルダの読み込みに失敗しました。\n\n" + root + "\n\n" + err.message);
      }
    }

    function populateChapters(){
      chapterSelect.innerHTML = "";

      if (chapters.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "チャプターなし";
        chapterSelect.appendChild(opt);
        return;
      }

      for (let i=0; i<chapters.length; i++){
        const ch = chapters[i];
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${ch.name} / ${ch.model ? getBaseName(ch.model) : "modelなし"} / PDF ${ch.pdfs ? ch.pdfs.length : (ch.pdf ? 1 : 0)}枚`;
        chapterSelect.appendChild(opt);
      }
    }


    function normalizeChapterName(name){
      const raw = String(name || "").trim();
      const match = raw.match(/CH\s*0*(\d+)/i);
      if (!match) return raw;
      return "CH" + String(parseInt(match[1], 10)).padStart(2, "0");
    }

    function getCurrentChapterName(){
      const ch = chapters[currentChapterIndex];
      return ch ? String(ch.name || "") : "";
    }

    function getChapterTargetScale(){
      const key = normalizeChapterName(getCurrentChapterName());
      return CHAPTER_TARGET_SCALE_MAP[key] || CHAPTER_BASELINE_TARGET_SCALE;
    }

    function updateChapterCorrectionStatus(){
      chapterCorrectionFactor = chapterCorrectionEnabled
        ? (getChapterTargetScale() / CHAPTER_BASELINE_TARGET_SCALE)
        : 1.0;

      const chName = normalizeChapterName(getCurrentChapterName()) || "未選択";
      const target = getChapterTargetScale();
      const factorText = chapterCorrectionFactor.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");

      if (chapterCorrectionStatus){
        chapterCorrectionStatus.textContent =
          `ARモデル補正: ${chapterCorrectionEnabled ? "ON" : "OFF"} / ${chName} / PDFは1/20→1/70固定 / モデルだけ×${factorText} / 参考:${target}`;
      }

      if (chapterCorrectionBtn){
        chapterCorrectionBtn.textContent = chapterCorrectionEnabled ? "モデル補正ON" : "モデル補正OFF";
        chapterCorrectionBtn.classList.toggle("lime", chapterCorrectionEnabled);
      }

      if (viewer){
        viewer.setAttribute("scale", `${chapterCorrectionFactor} ${chapterCorrectionFactor} ${chapterCorrectionFactor}`);
      }
    }

    async function loadChapter(index){
      if (index < 0 || index >= chapters.length) return;

      currentChapterIndex = index;
      const ch = chapters[index];
      chapterSelect.value = String(index);

      chapterNameText.textContent = ch.name;
      modelPathText.textContent = ch.model || "未登録";
      updateChapterCorrectionStatus();
      pdfFloorPathText.textContent = ch.floorPdf || "未登録";
      pdfSidePathText.textContent = ch.sidePdf || "未登録";

      if (ch.model) await loadModel(ch.model);
      await loadChapterPdfPreviews(ch);

      updateUrlState();
    }

    function updateUrlState(){
      const url = new URL(location.href);
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (chapters[currentChapterIndex]) url.searchParams.set("chapter", chapters[currentChapterIndex].name);
      history.replaceState(null, "", url.toString());
    }

    async function loadModel(path){
      currentModel = path;
      updateChapterCorrectionStatus();
      viewer.src = toAssetUrl(path);
      setObjectStatus(`MODEL LOADING: ${path} / AR補正×${chapterCorrectionFactor.toFixed(4)}`);
    }

    async function loadPdfPreview(path, targetImage){
      try{
        setPdfStatus("PDF LOADING: " + path);
        const ext = getExt(path);

        if (ext === ".pdf"){
          const task = pdfjsLib.getDocument(toAssetUrl(path));
          const pdf = await task.promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({scale:1.2});
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d", {alpha:false});
          ctx.fillStyle = "#fff";
          ctx.fillRect(0,0,canvas.width,canvas.height);
          await page.render({canvasContext:ctx, viewport}).promise;
          targetImage.src = canvas.toDataURL("image/png");
        } else {
          targetImage.src = toAssetUrl(path);
        }

        applyPdfScaleConversion();
        setPdfStatus("PDF PREVIEW: " + path + " / 初期プレビュー倍率 28.571%");
      }catch(err){
        console.error(err);
        setPdfStatus("PDF PREVIEW ERROR");
      }
    }



    async function loadChapterPdfPreviews(chapter){
      pdfFloorPreview.removeAttribute("src");
      pdfSidePreview.removeAttribute("src");

      const jobs = [];
      if (chapter.floorPdf) jobs.push(loadPdfPreview(chapter.floorPdf, pdfFloorPreview));
      if (chapter.sidePdf && chapter.sidePdf !== chapter.floorPdf) jobs.push(loadPdfPreview(chapter.sidePdf, pdfSidePreview));

      if (jobs.length === 0){
        setPdfStatus("このチャプターにPDFはありません。");
        return;
      }

      await Promise.all(jobs);
      applyPdfScaleConversion();
      setPdfStatus(`PDF PREVIEW: ${jobs.length}枚 / 床 ${chapter.floorPdf ? getBaseName(chapter.floorPdf) : "なし"} / 側面 ${chapter.sidePdf ? getBaseName(chapter.sidePdf) : "なし"}`);
    }

    function formatScaleNumber(value){
      const n = Number(value) || 0;
      if (Math.abs(n - Math.round(n)) < 0.000001) return String(Math.round(n));
      return n.toFixed(3).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function updatePdfScaleReadout(currentScale, targetScale, percent){
      if (!pdfScaleReadout) return;
      if (!currentScale || !targetScale || !percent){
        pdfScaleReadout.textContent = "縮尺換算: 未設定";
        return;
      }

      pdfScaleReadout.textContent =
        `縮尺換算: 1/${formatScaleNumber(currentScale)} → 1/${formatScaleNumber(targetScale)} = プレビュー倍率 ${formatScaleNumber(percent)}%`;
    }

    function applyPdfScaleConversion(){
      const currentScale = parseFloat(pdfCurrentScaleInput.value) || 0;
      const targetScale = parseFloat(pdfTargetScaleInput.value) || 0;

      if (currentScale <= 0 || targetScale <= 0){
        alert("縮尺は 100 や 50 のように、1/○ の分母だけ入力してください。");
        return;
      }

      const percent = Math.max(1, Math.min(5000, 100 * currentScale / targetScale));
      pdfFloorPreview.style.transform = `scale(${percent / 100})`;
      pdfSidePreview.style.transform = `scale(${percent / 100})`;
      pdfFloorPreview.style.marginBottom = `${Math.max(0, percent - 100) * 0.25}px`;
      pdfSidePreview.style.marginBottom = `${Math.max(0, percent - 100) * 0.25}px`;
      updatePdfScaleReadout(currentScale, targetScale, percent);
      setPdfStatus(`縮尺反映: 1/${formatScaleNumber(currentScale)} → 1/${formatScaleNumber(targetScale)} / プレビュー倍率 ${formatScaleNumber(percent)}%`);
    }

    function resetPdfScaleConversion(){
      pdfCurrentScaleInput.value = "20";
      pdfTargetScaleInput.value = "70";
      pdfFloorPreview.style.transform = "scale(0.28571)";
      pdfSidePreview.style.transform = "scale(0.28571)";
      pdfFloorPreview.style.marginBottom = "0";
      pdfSidePreview.style.marginBottom = "0";
      updatePdfScaleReadout(20, 70, 28.571);
      setPdfStatus("縮尺初期化: 1/20 → 1/70 / プレビュー倍率 28.571%");
    }

    function changeChapter(delta){
      if (chapters.length === 0) return;
      let next = currentChapterIndex + delta;
      if (next < 0) next = chapters.length - 1;
      if (next >= chapters.length) next = 0;
      loadChapter(next);
    }

    function refreshAnimations(){
      const animations = viewer.availableAnimations || [];
      animationSelect.innerHTML = "";

      if (animations.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "アニメーションなし";
        animationSelect.appendChild(opt);
        return;
      }

      for (const name of animations){
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        animationSelect.appendChild(opt);
      }

      animationSelect.value = animations[0];
      viewer.animationName = animations[0];
      viewer.timeScale = playSpeed;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
    }

    async function openAR(){
      if (!currentModel){
        alert("先にチャプターを選んでモデルを読み込んでください。");
        return;
      }

      try{
        await viewer.activateAR();
      }catch(err){
        console.error(err);
        alert("AR起動に失敗しました。\n\niPhoneの場合はSafariで試してください。\n保存になる場合はUSDZが必要な場合があります。");
      }
    }

    function open3D(){
      const ch = chapters[currentChapterIndex];
      const url = new URL(location.origin + location.pathname.replace(/\/[^\/]*$/, "/"));
      url.searchParams.set("v", "20260605_0029_v51");
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (ch) url.searchParams.set("chapter", ch.name);
      window.open(url.toString(), "_blank");
    }

    viewer.addEventListener("load", () => {
      refreshAnimations();
      setObjectStatus("読込完了: " + currentModel);
    });

    viewer.addEventListener("finished", () => {
      isPaused = true;
      playPauseBtn.textContent = "再生";
      if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      setObjectStatus("ANIMATION COMPLETE");
    });

    viewer.addEventListener("error", () => {
      setObjectStatus("MODEL LOAD ERROR");
    });

    viewer.addEventListener("ar-status", event => {
      setObjectStatus("AR STATUS: " + event.detail.status);
    });


    function closeMobilePanels(){
      refbar.classList.remove("mobile-open");
      objectSide.classList.remove("mobile-open");
      pdfSide.classList.remove("mobile-open");
      document.querySelector(".playbar")?.classList.remove("mobile-open");
      mobileQuickPanel?.classList.remove("mobile-open");
    }

    function openMobilePanel(panel){
      closeMobilePanels();

      if (panel === "quick"){
        mobileQuickPanel?.classList.add("mobile-open");
        return;
      }

      if (panel === "ref"){
        refbar.classList.add("mobile-open");
        return;
      }

      if (panel === "object"){
        objectSide.classList.add("mobile-open");
        return;
      }

      if (panel === "pdf"){
        pdfSide.classList.add("mobile-open");
        return;
      }

      if (panel === "anim"){
        document.querySelector(".playbar")?.classList.add("mobile-open");
      }
    }

    function toggleMobilePlay(){
      if (!currentModel) return;
      if (isPaused){
        viewer.play();
        isPaused = false;
        playPauseBtn.textContent = "一時停止";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "一時停止";
      } else {
        viewer.pause();
        isPaused = true;
        playPauseBtn.textContent = "再生";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      }
    }

    collapseRefBtn.addEventListener("click", () => {
      refbar.classList.toggle("collapsed");
      collapseRefBtn.textContent = refbar.classList.contains("collapsed") ? "参照フォルダ展開" : "参照フォルダ収納";
    });

    scanBtn.addEventListener("click", loadReferenceRoot);
    autoRootBtn.addEventListener("click", autoDetectRoot);
    chapterSelect.addEventListener("change", () => loadChapter(parseInt(chapterSelect.value,10)));
    prevChapterBtn.addEventListener("click", () => changeChapter(-1));
    nextChapterBtn.addEventListener("click", () => changeChapter(1));
    prevBottomBtn.addEventListener("click", () => changeChapter(-1));

    arStartBtn.addEventListener("click", openAR);
    modelUrlBtn.addEventListener("click", () => {
      if (!currentModel) return alert("モデル未読込");
      prompt("モデルURL", toAssetUrl(currentModel));
    });
    clearModelBtn.addEventListener("click", () => {
      currentModel = "";
      viewer.removeAttribute("src");
      setObjectStatus("MODEL CLEARED");
    });
    resetViewBtn.addEventListener("click", () => {
      viewer.cameraOrbit = "25deg 70deg 130%";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
    });

    chapterCorrectionBtn.addEventListener("click", () => {
      chapterCorrectionEnabled = !chapterCorrectionEnabled;
      updateChapterCorrectionStatus();
      setObjectStatus(`ARモデル補正 ${chapterCorrectionEnabled ? "ON" : "OFF"} / ×${chapterCorrectionFactor.toFixed(4)}`);
    });

    chapterCorrectionApplyBtn.addEventListener("click", () => {
      pdfCurrentScaleInput.value = "20";
      pdfTargetScaleInput.value = "70";
      applyPdfScaleConversion();
      updateChapterCorrectionStatus();
      setObjectStatus(`AR補正再反映: PDFは1/20→1/70固定 / モデルだけ×${chapterCorrectionFactor.toFixed(4)}`);
    });

    mobilePrevBtn.addEventListener("click", () => changeChapter(-1));
    mobileNextBtn.addEventListener("click", () => changeChapter(1));
    mobilePlayBtn.addEventListener("click", toggleMobilePlay);
    mobileArBtn.addEventListener("click", openAR);
    mobilePanelBtn.addEventListener("click", () => {
      if (mobileQuickPanel.classList.contains("mobile-open")) closeMobilePanels();
      else openMobilePanel("quick");
    });
    mobileBack3dBtn.addEventListener("click", open3D);

    mobileOpenRefBtn.addEventListener("click", () => openMobilePanel("ref"));
    mobileOpenObjectBtn.addEventListener("click", () => openMobilePanel("object"));
    mobileResetViewBtn.addEventListener("click", () => {
      closeMobilePanels();
      viewer.cameraOrbit = "25deg 70deg 130%";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
    });
    mobileClosePanelsBtn.addEventListener("click", closeMobilePanels);

    playPauseBtn.addEventListener("click", () => {
      if (!currentModel) return;
      if (isPaused){
        viewer.play();
        isPaused = false;
        playPauseBtn.textContent = "一時停止";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "一時停止";
      } else {
        viewer.pause();
        isPaused = true;
        playPauseBtn.textContent = "再生";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      }
    });

    restartBtn.addEventListener("click", () => {
      viewer.currentTime = 0;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
      if (mobilePlayBtn) mobilePlayBtn.textContent = "一時停止";
    });

    speedRange.addEventListener("input", () => {
      playSpeed = parseFloat(speedRange.value) || 0.8;
      speedText.textContent = playSpeed.toFixed(2) + "x";
      viewer.timeScale = playSpeed;
    });

    animationSelect.addEventListener("change", () => {
      if (!animationSelect.value) return;
      viewer.animationName = animationSelect.value;
      viewer.currentTime = 0;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
    });

    applyPdfScaleBtn.addEventListener("click", applyPdfScaleConversion);
    resetPdfScaleBtn.addEventListener("click", resetPdfScaleConversion);
    pdfCurrentScaleInput.addEventListener("change", applyPdfScaleConversion);
    pdfTargetScaleInput.addEventListener("change", applyPdfScaleConversion);

    back3dBtn.addEventListener("click", open3D);

    if (initialRoot) rootInput.value = initialRoot;
    chapterCorrectionBtn.classList.toggle("lime", chapterCorrectionEnabled);
    updateChapterCorrectionStatus();
    loadReferenceRoot();
  </script>
</body>
</html>
