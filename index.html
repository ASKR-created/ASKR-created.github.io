<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF 3D Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root{
      --bg0:#02030a;
      --bg1:#061020;
      --panel:rgba(8,16,32,.74);
      --panel2:rgba(14,24,48,.82);
      --cyan:#22f8ff;
      --blue:#377cff;
      --magenta:#ff2deb;
      --lime:#a6ff2d;
      --yellow:#ffe66d;
      --text:#eafbff;
      --sub:#91a6c9;
      --danger:#ff477e;
      --line:rgba(34,248,255,.32);
      --shadow:0 0 18px rgba(34,248,255,.20), 0 0 36px rgba(255,45,235,.10);
    }

    *{ box-sizing:border-box; }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,248,255,.10), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(255,45,235,.11), transparent 32%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 55%, #050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,248,255,.025) 1px, transparent 1px);
      background-size:4px 4px, 18px 18px;
      mix-blend-mode:screen;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.04), transparent 1px);
      background-size:100% 5px;
      opacity:.34;
    }

    #app{
      position:relative;
      z-index:3;
      width:100%;
      height:100%;
    }

    #viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      outline:none;
      cursor:grab;
    }
    #viewer:active{ cursor:grabbing; }

    .hud-top{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:10;
      display:flex;
      gap:10px;
      align-items:stretch;
      pointer-events:none;
    }

    .brand{
      flex:1;
      min-width:0;
      pointer-events:auto;
      border:1px solid rgba(34,248,255,.45);
      background:linear-gradient(90deg, rgba(8,16,32,.86), rgba(10,22,44,.62));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      padding:10px 14px;
    }

    .brand-line{
      height:2px;
      margin-bottom:7px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.65);
    }

    .brand-title{
      font-size:16px;
      font-weight:bold;
      letter-spacing:.12em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-shadow:0 0 9px rgba(34,248,255,.7);
    }

    .brand-sub{
      margin-top:4px;
      color:var(--sub);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .digital{
      width:210px;
      max-width:34vw;
      pointer-events:auto;
      border:1px solid rgba(166,255,45,.45);
      background:rgba(2,5,14,.78);
      box-shadow:0 0 18px rgba(166,255,45,.16);
      padding:10px;
      text-align:right;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .digital .label{
      color:var(--sub);
      font-size:10px;
      letter-spacing:.18em;
    }

    .digital .value{
      margin-top:4px;
      color:var(--lime);
      font-family:Consolas,"Courier New",monospace;
      font-size:14px;
      font-weight:bold;
      text-shadow:0 0 8px rgba(166,255,45,.55);
    }

    .panel{
      position:absolute;
      z-index:12;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      color:var(--text);
    }

    .panel:hover{
      border-color:rgba(255,45,235,.62);
      box-shadow:0 0 20px rgba(255,45,235,.20), 0 0 34px rgba(34,248,255,.16);
    }

    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px 10px;
      border-bottom:1px solid rgba(34,248,255,.22);
      background:linear-gradient(90deg, rgba(34,248,255,.12), rgba(255,45,235,.08));
    }

    .panel-title{
      font-size:12px;
      font-weight:bold;
      letter-spacing:.12em;
      color:var(--cyan);
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .panel-body{
      padding:10px;
    }

    .toggle{
      border:1px solid rgba(34,248,255,.48);
      background:rgba(2,8,18,.75);
      color:var(--cyan);
      height:24px;
      min-width:32px;
      cursor:pointer;
      font-weight:bold;
      box-shadow:inset 0 0 12px rgba(34,248,255,.08);
    }

    .toggle:hover{
      color:white;
      background:linear-gradient(90deg, rgba(34,248,255,.22), rgba(255,45,235,.20));
      box-shadow:0 0 16px rgba(34,248,255,.28);
    }

    .collapsed .panel-body{ display:none; }

    #modelPanel{
      left:10px;
      top:92px;
      bottom:12px;
      width:330px;
      max-width:calc(100vw - 20px);
      display:flex;
      flex-direction:column;
    }

    #modelPanel .panel-body{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    #infoPanel{
      right:10px;
      top:92px;
      width:330px;
      max-width:calc(100vw - 20px);
    }

    #commandPanel{
      right:10px;
      bottom:12px;
      width:330px;
      max-width:calc(100vw - 20px);
    }

    .search{
      width:100%;
      height:34px;
      border:1px solid rgba(34,248,255,.34);
      background:rgba(1,5,14,.88);
      color:var(--text);
      padding:0 10px;
      outline:none;
    }

    .search:focus{
      border-color:var(--magenta);
      box-shadow:0 0 14px rgba(255,45,235,.22);
    }

    .list{
      flex:1;
      min-height:0;
      overflow:auto;
      padding-right:2px;
    }

    .item{
      width:100%;
      margin:0 0 7px 0;
      padding:9px 10px;
      border:1px solid rgba(55,124,255,.28);
      background:linear-gradient(90deg, rgba(5,13,28,.92), rgba(12,23,48,.68));
      color:var(--text);
      text-align:left;
      cursor:pointer;
      font-size:12px;
      line-height:1.35;
    }

    .item:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.20);
      transform:translateX(2px);
    }

    .item.active{
      border-color:var(--magenta);
      background:linear-gradient(90deg, rgba(255,45,235,.20), rgba(34,248,255,.10));
      box-shadow:0 0 18px rgba(255,45,235,.18);
    }

    .item-name{
      font-weight:bold;
      word-break:break-all;
    }

    .item-path{
      margin-top:3px;
      color:var(--sub);
      font-size:10px;
      word-break:break-all;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:7px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      min-height:18px;
      border:1px solid rgba(34,248,255,.35);
      color:var(--cyan);
      background:rgba(34,248,255,.06);
      padding:2px 6px;
      font-size:10px;
      font-family:Consolas,"Courier New",monospace;
    }

    .badge.magenta{
      border-color:rgba(255,45,235,.45);
      color:var(--magenta);
      background:rgba(255,45,235,.07);
    }

    .badge.lime{
      border-color:rgba(166,255,45,.45);
      color:var(--lime);
      background:rgba(166,255,45,.07);
    }

    .row{
      display:grid;
      grid-template-columns:96px 1fr;
      gap:8px;
      margin:7px 0;
      font-size:12px;
    }

    .row .k{ color:var(--sub); }
    .row .v{ color:var(--text); word-break:break-all; }

    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.55;
    }

    .warning{
      color:var(--yellow);
    }

    .button-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .btn{
      position:relative;
      min-height:36px;
      border:1px solid rgba(34,248,255,.42);
      background:linear-gradient(180deg, rgba(15,28,58,.92), rgba(3,8,18,.92));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      overflow:hidden;
      letter-spacing:.04em;
    }

    .btn::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center, rgba(34,248,255,.32), transparent 62%);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .22s ease;
    }

    .btn:hover::before{ transform:scaleX(1); }

    .btn:hover{
      border-color:var(--cyan);
      color:white;
      box-shadow:0 0 18px rgba(34,248,255,.22);
    }

    .btn.magenta{ border-color:rgba(255,45,235,.42); }
    .btn.magenta:hover{ border-color:var(--magenta); box-shadow:0 0 18px rgba(255,45,235,.24); }

    .btn.lime{ border-color:rgba(166,255,45,.42); }
    .btn.lime:hover{ border-color:var(--lime); box-shadow:0 0 18px rgba(166,255,45,.20); }

    .btn span{
      position:relative;
      z-index:1;
    }

    .statusbar{
      position:absolute;
      left:10px;
      bottom:12px;
      z-index:9;
      max-width:calc(100vw - 370px);
      border:1px solid rgba(166,255,45,.32);
      background:rgba(2,8,16,.70);
      color:var(--lime);
      padding:8px 10px;
      font-size:12px;
      font-family:Consolas,"Courier New",monospace;
      box-shadow:0 0 14px rgba(166,255,45,.12);
      pointer-events:none;
    }

    .mobile-panel-button{
      display:none;
      position:absolute;
      left:10px;
      top:92px;
      z-index:20;
      min-height:38px;
      padding:0 12px;
      border:1px solid rgba(34,248,255,.48);
      background:rgba(5,12,28,.88);
      color:var(--cyan);
      font-weight:bold;
      box-shadow:var(--shadow);
    }

    .empty{
      border:1px dashed rgba(145,166,201,.34);
      color:var(--sub);
      padding:12px;
      font-size:12px;
      line-height:1.55;
    }

    @media (max-width: 820px){
      .hud-top{
        top:8px;
        left:8px;
        right:8px;
      }
      .digital{ display:none; }
      .brand-title{ font-size:13px; }
      .brand-sub{ font-size:11px; }

      .mobile-panel-button{ display:block; }

      #modelPanel,
      #infoPanel,
      #commandPanel{
        left:8px;
        right:8px;
        width:auto;
        max-width:none;
      }

      #modelPanel{
        top:138px;
        bottom:calc(50vh + 8px);
        display:none;
      }

      #infoPanel{
        top:auto;
        bottom:188px;
        display:none;
      }

      #commandPanel{
        bottom:8px;
      }

      body.mobile-open #modelPanel,
      body.mobile-open #infoPanel{
        display:flex;
      }

      .button-grid{
        grid-template-columns:1fr 1fr;
      }

      .statusbar{
        display:none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewer"></canvas>

    <div class="hud-top">
      <div class="brand">
        <div class="brand-line"></div>
        <div class="brand-title">SF 3D MODEL VIEWER</div>
        <div class="brand-sub">NO PASSWORD / NO ADS / AR停止中 temporarily disabled</div>
      </div>
      <div class="digital">
        <div class="label">SYSTEM DATE</div>
        <div class="value" id="dateText">----</div>
      </div>
    </div>

    <button class="mobile-panel-button" id="mobilePanelBtn">PANEL</button>

    <section class="panel" id="modelPanel">
      <div class="panel-head">
        <div class="panel-title">MODEL LIST</div>
        <button class="toggle" data-target="modelPanel">−</button>
      </div>
      <div class="panel-body">
        <input class="search" id="searchInput" placeholder="モデル名で検索">
        <div class="badge-row">
          <span class="badge">OBJ</span>
          <span class="badge">FBX</span>
          <span class="badge lime">GLB</span>
          <span class="badge lime">GLTF</span>
        </div>
        <div class="list" id="modelList">
          <div class="empty">models/ を読み込み中...</div>
        </div>
      </div>
    </section>

    <section class="panel" id="infoPanel">
      <div class="panel-head">
        <div class="panel-title">MODEL INFO</div>
        <button class="toggle" data-target="infoPanel">−</button>
      </div>
      <div class="panel-body">
        <div class="row"><div class="k">NAME</div><div class="v" id="infoName">未選択</div></div>
        <div class="row"><div class="k">TYPE</div><div class="v" id="infoType">---</div></div>
        <div class="row"><div class="k">PATH</div><div class="v" id="infoPath">---</div></div>
        <div class="row"><div class="k">AR</div><div class="v" id="infoAr">GLB / GLTF推奨</div></div>
        <div class="hint warning" id="infoHint">OBJ / FBXは3D表示用。ARはGLB / GLTFが安定。</div>
      </div>
    </section>

    <section class="panel" id="commandPanel">
      <div class="panel-head">
        <div class="panel-title">COMMAND</div>
        <button class="toggle" data-target="commandPanel">−</button>
      </div>
      <div class="panel-body">
        <div class="button-grid">
          <button class="btn" id="reloadBtn"><span>再読み込み</span></button>
          <button class="btn lime" id="resetViewBtn"><span>視点リセット</span></button>
          <button class="btn magenta" id="openArBtn"><span>ARビューアー</span></button>
          <button class="btn" id="copyArUrlBtn"><span>AR URL表示</span></button>
          <button class="btn" id="toggleAnimBtn"><span>アニメ再生/停止</span></button>
          <button class="btn lime" id="fitBtn"><span>画面に合わせる</span></button>
        </div>
        <p class="hint">マウス：回転 / ホイール：拡大縮小 / 右ドラッグ：移動</p>
      </div>
    </section>

    <div class="statusbar" id="statusText">SYSTEM READY</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
    import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

    const GITHUB_OWNER = "ASKR-created";
    const GITHUB_REPO = "ASKR-created.github.io";
    const GITHUB_REFS = ["main", "master"];
    const MODELS_ROOT = "models";
    const MODEL_EXTENSIONS = [".obj", ".fbx", ".glb", ".gltf"];

    const canvas = document.getElementById("viewer");
    const modelList = document.getElementById("modelList");
    const searchInput = document.getElementById("searchInput");
    const statusText = document.getElementById("statusText");
    const dateText = document.getElementById("dateText");

    const infoName = document.getElementById("infoName");
    const infoType = document.getElementById("infoType");
    const infoPath = document.getElementById("infoPath");
    const infoAr = document.getElementById("infoAr");
    const infoHint = document.getElementById("infoHint");

    const reloadBtn = document.getElementById("reloadBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const openArBtn = document.getElementById("openArBtn");
    const copyArUrlBtn = document.getElementById("copyArUrlBtn");
    const toggleAnimBtn = document.getElementById("toggleAnimBtn");
    const fitBtn = document.getElementById("fitBtn");
    const mobilePanelBtn = document.getElementById("mobilePanelBtn");

    let allModels = [];
    let fileMap = new Map();
    let selectedModel = null;
    let currentObject = null;
    let mixer = null;
    let animationsEnabled = true;
    let currentBox = null;
    let currentSize = 1;

    const clock = new THREE.Clock();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030a);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 100000);
    camera.position.set(3, 2, 4);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0, 0);

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x101018, 1.6);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(4, 8, 6);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x22f8ff, 0.8);
    fillLight.position.set(-5, 2, -4);
    scene.add(fillLight);

    const magentaLight = new THREE.PointLight(0xff2deb, 0.9, 18);
    magentaLight.position.set(-3, 2.5, 3);
    scene.add(magentaLight);

    const grid = new THREE.GridHelper(10, 20, 0x22f8ff, 0x18324f);
    grid.material.transparent = true;
    grid.material.opacity = 0.28;
    scene.add(grid);

    const axesGroup = new THREE.Group();
    scene.add(axesGroup);
    makeAxisLine(0xff477e, new THREE.Vector3(1, 0, 0), "X");
    makeAxisLine(0xa6ff2d, new THREE.Vector3(0, 1, 0), "Y");
    makeAxisLine(0x22f8ff, new THREE.Vector3(0, 0, 1), "Z");

    function makeAxisLine(color, dir, label){
      const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:.65 });
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0),
        dir.clone().multiplyScalar(1.2)
      ]);
      const line = new THREE.Line(geo, mat);
      axesGroup.add(line);
    }

    function setStatus(text){
      statusText.textContent = text;
      console.log("[STATUS]", text);
    }

    function updateDate(){
      const now = new Date();
      const week = ["SUN","MON","TUE","WED","THU","FRI","SAT"][now.getDay()];
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth()+1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");
      dateText.textContent = `${yyyy}.${mm}.${dd} ${week} ${hh}:${mi}`;
    }
    updateDate();
    setInterval(updateDate, 15000);

    function encodePath(path){
      return String(path)
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return encodePath(path).replace(/%3A/g, ":");
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function getBaseName(path){
      return String(path).split("/").pop() || path;
    }

    function getDir(path){
      const s = String(path);
      const i = s.lastIndexOf("/");
      return i >= 0 ? s.slice(0, i + 1) : "";
    }

    function withoutExt(path){
      return String(path).replace(/\.[^.\/]+$/, "");
    }

    async function fetchGitHubContents(path, ref){
      const safePath = encodePath(path);
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${safePath}?ref=${encodeURIComponent(ref)}`;
      const res = await fetch(url, {
        headers: { "Accept": "application/vnd.github+json" }
      });
      if (!res.ok){
        throw new Error(`GitHub API ${res.status}: ${path}`);
      }
      return await res.json();
    }

    async function scanModelsRecursive(path, ref, bucket){
      const items = await fetchGitHubContents(path, ref);
      if (!Array.isArray(items)) return bucket;

      for (const item of items){
        if (item.type === "dir"){
          await scanModelsRecursive(item.path, ref, bucket);
        } else if (item.type === "file"){
          const ext = getExt(item.path);
          const record = {
            name: item.name,
            path: item.path,
            ext,
            size: item.size || 0,
            html_url: item.html_url || "",
            download_url: item.download_url || ""
          };
          fileMap.set(item.path.toLowerCase(), record);
          if (MODEL_EXTENSIONS.includes(ext)){
            bucket.push(record);
          }
        }
      }
      return bucket;
    }

    async function loadModelList(){
      setStatus("SCANNING models/ ...");
      modelList.innerHTML = `<div class="empty">GitHub APIで models/ を走査中...</div>`;
      allModels = [];
      fileMap = new Map();

      let lastError = null;

      for (const ref of GITHUB_REFS){
        try{
          const bucket = [];
          await scanModelsRecursive(MODELS_ROOT, ref, bucket);
          allModels = bucket.sort((a,b) => a.path.localeCompare(b.path, "ja"));
          setStatus(`LOADED ${allModels.length} MODELS / BRANCH ${ref}`);
          renderModelList();
          if (allModels.length > 0){
            selectModel(allModels[0]);
          }
          return;
        }catch(err){
          lastError = err;
          console.warn(err);
        }
      }

      modelList.innerHTML = `
        <div class="empty">
          models/ を読み込めませんでした。<br>
          GitHub Pages上で実行しているか、リポジトリ名・modelsフォルダを確認してください。<br>
          ${lastError ? String(lastError.message) : ""}
        </div>
      `;
      setStatus("MODEL SCAN FAILED");
    }

    function renderModelList(){
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allModels.filter(m => {
        if (!q) return true;
        return m.name.toLowerCase().includes(q) || m.path.toLowerCase().includes(q);
      });

      if (filtered.length === 0){
        modelList.innerHTML = `<div class="empty">該当するモデルがありません。</div>`;
        return;
      }

      modelList.innerHTML = "";
      for (const m of filtered){
        const btn = document.createElement("button");
        btn.className = "item" + (selectedModel && selectedModel.path === m.path ? " active" : "");
        btn.innerHTML = `
          <div class="item-name">${escapeHtml(m.name)}</div>
          <div class="item-path">${escapeHtml(m.path)}</div>
          <div class="badge-row">
            <span class="badge ${m.ext === ".glb" || m.ext === ".gltf" ? "lime" : ""}">${escapeHtml(m.ext.toUpperCase().slice(1))}</span>
            ${m.ext === ".obj" ? `<span class="badge magenta">${hasSameMtl(m) ? "MTLあり" : "MTLなし"}</span>` : ""}
            ${m.ext === ".glb" || m.ext === ".gltf" ? `<span class="badge lime">AR推奨</span>` : `<span class="badge">3D表示</span>`}
          </div>
        `;
        btn.addEventListener("click", () => selectModel(m));
        modelList.appendChild(btn);
      }
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[s]));
    }

    function hasSameMtl(model){
      const mtlPath = withoutExt(model.path) + ".mtl";
      return fileMap.has(mtlPath.toLowerCase());
    }

    async function selectModel(model){
      selectedModel = model;
      renderModelList();

      infoName.textContent = model.name;
      infoType.textContent = model.ext.toUpperCase().slice(1);
      infoPath.textContent = model.path;

      const arReady = model.ext === ".glb" || model.ext === ".gltf";
      infoAr.textContent = arReady ? "対応しやすい形式" : "AR用GLB/GLTFを別途推奨";
      infoHint.textContent = arReady
        ? "GLB / GLTFはAR表示に向いています。現在はARビューアーのみ使用します。"
        : "OBJ / FBXは3D表示用です。ARでは同名GLBを用意すると安定します。";

      await loadSelectedModel(model);
    }

    function clearCurrentModel(){
      if (currentObject){
        scene.remove(currentObject);
        disposeObject(currentObject);
      }
      currentObject = null;
      mixer = null;
      currentBox = null;
    }

    function disposeObject(obj){
      obj.traverse(child => {
        if (child.geometry) child.geometry.dispose?.();
        if (child.material){
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(mat => {
            for (const key in mat){
              const v = mat[key];
              if (v && v.isTexture) v.dispose?.();
            }
            mat.dispose?.();
          });
        }
      });
    }

    async function loadSelectedModel(model){
      clearCurrentModel();
      setStatus(`LOADING ${model.path}`);

      const ext = model.ext;
      const url = toAssetUrl(model.path);
      const baseDir = toAssetUrl(getDir(model.path));
      const filename = getBaseName(model.path);

      try{
        if (ext === ".glb" || ext === ".gltf"){
          await loadGltf(url);
        } else if (ext === ".obj"){
          await loadObj(model, baseDir, filename);
        } else if (ext === ".fbx"){
          await loadFbx(url, baseDir);
        } else {
          throw new Error("Unsupported format: " + ext);
        }

        fitCurrentObject();
        setStatus(`DISPLAYING ${model.name}`);
      }catch(err){
        console.error(err);
        setStatus("LOAD ERROR");
        alert("モデルの読み込みに失敗しました。\n\n" + model.path + "\n\n" + err.message);
      }
    }

    function prepareModelObject(obj){
      obj.traverse(child => {
        if (child.isMesh){
          child.castShadow = true;
          child.receiveShadow = true;

          if (!child.material){
            child.material = new THREE.MeshStandardMaterial({
              color: 0xbfd8ff,
              roughness: .7,
              metalness: .05
            });
          }

          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(mat => {
            if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
            mat.needsUpdate = true;
          });
        }
      });
    }

    async function loadGltf(url){
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(url);
      currentObject = gltf.scene || gltf.scenes[0];
      prepareModelObject(currentObject);
      scene.add(currentObject);

      if (gltf.animations && gltf.animations.length){
        mixer = new THREE.AnimationMixer(currentObject);
        gltf.animations.forEach(clip => mixer.clipAction(clip).play());
        animationsEnabled = true;
      }
    }

    async function loadObj(model, baseDir, filename){
      const objLoader = new OBJLoader();
      objLoader.setPath(baseDir);

      const mtlPath = withoutExt(model.path) + ".mtl";
      const mtlRecord = fileMap.get(mtlPath.toLowerCase());

      if (mtlRecord){
        const mtlLoader = new MTLLoader();
        mtlLoader.setPath(baseDir);
        mtlLoader.setResourcePath(baseDir);
        const materials = await mtlLoader.loadAsync(getBaseName(mtlRecord.path));
        materials.preload();
        objLoader.setMaterials(materials);
      }

      currentObject = await objLoader.loadAsync(filename);
      prepareModelObject(currentObject);
      scene.add(currentObject);
    }

    async function loadFbx(url, baseDir){
      const loader = new FBXLoader();
      loader.setResourcePath(baseDir);
      currentObject = await loader.loadAsync(url);
      prepareModelObject(currentObject);
      scene.add(currentObject);

      if (currentObject.animations && currentObject.animations.length){
        mixer = new THREE.AnimationMixer(currentObject);
        currentObject.animations.forEach(clip => mixer.clipAction(clip).play());
        animationsEnabled = true;
      }
    }

    function fitCurrentObject(){
      if (!currentObject) return;

      currentObject.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(currentObject);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      currentObject.position.sub(center);
      currentObject.updateWorldMatrix(true, true);

      const centeredBox = new THREE.Box3().setFromObject(currentObject);
      const centeredSize = new THREE.Vector3();
      centeredBox.getSize(centeredSize);

      const maxDim = Math.max(centeredSize.x, centeredSize.y, centeredSize.z) || 1;
      currentSize = maxDim;
      currentBox = centeredBox;

      camera.near = Math.max(maxDim / 1000, 0.001);
      camera.far = Math.max(maxDim * 100, 1000);
      camera.updateProjectionMatrix();

      camera.position.set(maxDim * 1.25, maxDim * 0.9, maxDim * 1.65);
      controls.target.set(0, 0, 0);
      controls.update();

      grid.scale.setScalar(Math.max(maxDim / 5, 1));
      axesGroup.scale.setScalar(Math.max(maxDim / 5, 1));
    }

    function resetView(){
      if (!currentObject){
        camera.position.set(3, 2, 4);
        controls.target.set(0, 0, 0);
        controls.update();
        return;
      }
      fitCurrentObject();
      setStatus("VIEW RESET");
    }

    function openAr(kind){
      if (!selectedModel){
        alert("モデルを選択してください。");
        return;
      }

      const ext = selectedModel.ext;
      if (ext !== ".glb" && ext !== ".gltf"){
        const ok = confirm("AR表示はGLB / GLTF推奨です。\nOBJ / FBXの場合はAR側で表示できない可能性があります。\nそれでも開きますか？");
        if (!ok) return;
      }

      const file = encodeURIComponent(selectedModel.path);
      location.href = `${location.origin}/ar.html?file=${file}`;
    }

    function toggleAnimation(){
      if (!mixer){
        setStatus("NO ANIMATION DATA");
        return;
      }
      animationsEnabled = !animationsEnabled;
      setStatus(animationsEnabled ? "ANIMATION PLAY" : "ANIMATION PAUSE");
    }

    function resize(){
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
    }

    function animate(){
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && animationsEnabled){
        mixer.update(delta);
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", resize);
    searchInput.addEventListener("input", renderModelList);
    reloadBtn.addEventListener("click", loadModelList);
    resetViewBtn.addEventListener("click", resetView);
    fitBtn.addEventListener("click", fitCurrentObject);
    openArBtn.addEventListener("click", () => openAr("current"));
    copyArUrlBtn.addEventListener("click", () => {
      if (!selectedModel){
        alert("モデルを選択してください。");
        return;
      }
      const url = `${location.origin}/ar.html?file=${encodeURIComponent(selectedModel.path)}`;
      prompt("ARビューアー確認用URL", url);
    });
    toggleAnimBtn.addEventListener("click", toggleAnimation);

    mobilePanelBtn.addEventListener("click", () => {
      document.body.classList.toggle("mobile-open");
    });

    document.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-target");
        const panel = document.getElementById(id);
        panel.classList.toggle("collapsed");
        btn.textContent = panel.classList.contains("collapsed") ? "+" : "−";
      });
    });

    resize();
    animate();
    loadModelList();
  </script>
</body>
</html>
