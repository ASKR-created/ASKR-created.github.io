<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF AR Viewer</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --bg0:#02030a;
      --bg1:#061020;
      --panel:rgba(8,16,32,.74);
      --cyan:#22f8ff;
      --blue:#377cff;
      --magenta:#ff2deb;
      --lime:#a6ff2d;
      --yellow:#ffe66d;
      --text:#eafbff;
      --sub:#91a6c9;
      --line:rgba(34,248,255,.36);
      --shadow:0 0 18px rgba(34,248,255,.20), 0 0 36px rgba(255,45,235,.10);
    }

    *{ box-sizing:border-box; }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,248,255,.10), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,45,235,.12), transparent 32%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 55%, #050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,248,255,.025) 1px, transparent 1px);
      background-size:5px 5px,18px 18px;
      mix-blend-mode:screen;
    }

    model-viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:transparent;
      --poster-color:transparent;
      --progress-bar-color:#22f8ff;
      --progress-bar-height:3px;
    }

    .hud{
      position:absolute;
      z-index:10;
      top:10px;
      left:10px;
      right:10px;
      display:flex;
      gap:10px;
      pointer-events:none;
    }

    .brand{
      flex:1;
      pointer-events:auto;
      border:1px solid rgba(34,248,255,.45);
      background:linear-gradient(90deg, rgba(8,16,32,.86), rgba(10,22,44,.62));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      padding:10px 14px;
      min-width:0;
    }

    .brand-line{
      height:2px;
      margin-bottom:7px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.65);
    }

    .brand-title{
      font-size:16px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 9px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-sub{
      margin-top:4px;
      color:var(--sub);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .panel{
      position:absolute;
      z-index:11;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      color:var(--text);
    }

    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px 10px;
      border-bottom:1px solid rgba(34,248,255,.22);
      background:linear-gradient(90deg, rgba(34,248,255,.12), rgba(255,45,235,.08));
    }

    .panel-title{
      font-size:12px;
      font-weight:bold;
      letter-spacing:.12em;
      color:var(--cyan);
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .panel-body{ padding:10px; }
    .collapsed .panel-body{ display:none; }

    .toggle{
      border:1px solid rgba(34,248,255,.48);
      background:rgba(2,8,18,.75);
      color:var(--cyan);
      height:24px;
      min-width:32px;
      cursor:pointer;
      font-weight:bold;
    }

    .info{
      left:10px;
      bottom:12px;
      width:360px;
      max-width:calc(100vw - 20px);
    }

    .commands{
      right:10px;
      bottom:12px;
      width:330px;
      max-width:calc(100vw - 20px);
    }

    .row{
      display:grid;
      grid-template-columns:86px 1fr;
      gap:8px;
      margin:7px 0;
      font-size:12px;
    }
    .row .k{ color:var(--sub); }
    .row .v{ color:var(--text); word-break:break-all; }

    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.55;
    }

    .warning{ color:var(--yellow); }

    .button-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .btn, .ar-button{
      position:relative;
      min-height:38px;
      border:1px solid rgba(34,248,255,.42);
      background:linear-gradient(180deg, rgba(15,28,58,.92), rgba(3,8,18,.92));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      overflow:hidden;
      letter-spacing:.04em;
      padding:0 10px;
    }

    .btn:hover, .ar-button:hover{
      border-color:var(--cyan);
      color:white;
      box-shadow:0 0 18px rgba(34,248,255,.22);
    }

    .btn.magenta{ border-color:rgba(255,45,235,.42); }
    .btn.magenta:hover{ border-color:var(--magenta); box-shadow:0 0 18px rgba(255,45,235,.24); }

    .ar-button{
      position:absolute;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      z-index:15;
      border-color:rgba(166,255,45,.60);
      color:var(--lime);
      min-width:180px;
      box-shadow:0 0 18px rgba(166,255,45,.18);
    }

    .message{
      position:absolute;
      inset:auto 10px 110px 10px;
      z-index:12;
      display:none;
      border:1px solid rgba(255,230,109,.42);
      background:rgba(24,20,6,.78);
      color:var(--yellow);
      padding:10px;
      font-size:13px;
      line-height:1.5;
      box-shadow:0 0 18px rgba(255,230,109,.12);
    }

    @media (max-width:820px){
      .hud{
        top:8px;
        left:8px;
        right:8px;
      }
      .brand-title{ font-size:13px; }
      .brand-sub{ font-size:11px; }

      .info{
        left:8px;
        right:8px;
        bottom:172px;
        width:auto;
      }
      .commands{
        left:8px;
        right:8px;
        bottom:8px;
        width:auto;
      }
      .ar-button{
        bottom:96px;
      }
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="0.75"
    exposure="1.1"
    ar
    ar-modes="webxr scene-viewer"
    ar-scale="auto"
  >
    <button slot="ar-button" class="ar-button">ARで表示</button>
  </model-viewer>

  <div class="hud">
    <div class="brand">
      <div class="brand-line"></div>
      <div class="brand-title">SF AR VIEWER</div>
      <div class="brand-sub">model-viewer / GLB・GLTF推奨 / USDZなし</div>
    </div>
  </div>

  <section class="panel info" id="infoPanel">
    <div class="panel-head">
      <div class="panel-title">MODEL INFO</div>
      <button class="toggle" data-target="infoPanel">−</button>
    </div>
    <div class="panel-body">
      <div class="row"><div class="k">FILE</div><div class="v" id="fileText">---</div></div>
      <div class="row"><div class="k">TYPE</div><div class="v" id="typeText">---</div></div>
      <div class="row"><div class="k">STATUS</div><div class="v" id="statusText">READY</div></div>
      <p class="hint warning">ARはGLB / GLTF中心。iPhoneはUSDZなしだと安定しない場合があります。</p>
    </div>
  </section>

  <section class="panel commands" id="commandPanel">
    <div class="panel-head">
      <div class="panel-title">COMMAND</div>
      <button class="toggle" data-target="commandPanel">−</button>
    </div>
    <div class="panel-body">
      <div class="button-grid">
        <button class="btn" id="backBtn">3Dへ戻る</button>
        <button class="btn magenta" id="webxrBtn">WebXR AR</button>
        <button class="btn" id="resetBtn">視点リセット</button>
        <button class="btn magenta" id="rotateBtn">回転 ON/OFF</button>
      </div>
      <p class="hint">ピンチ：拡大縮小 / ドラッグ：回転 / ARボタン：端末のAR機能を起動</p>
    </div>
  </section>

  <div class="message" id="messageBox"></div>

  <script>
    const viewer = document.getElementById("viewer");
    const fileText = document.getElementById("fileText");
    const typeText = document.getElementById("typeText");
    const statusText = document.getElementById("statusText");
    const messageBox = document.getElementById("messageBox");

    const params = new URLSearchParams(location.search);
    const rawFile = params.get("file") ? decodeURIComponent(params.get("file")) : "";

    function encodePath(path){
      return String(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return encodePath(path).replace(/%3A/g, ":");
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function setStatus(text){
      statusText.textContent = text;
      console.log("[AR]", text);
    }

    function showMessage(text){
      messageBox.textContent = text;
      messageBox.style.display = "block";
    }

    if (!rawFile){
      setStatus("NO FILE");
      showMessage("fileパラメータがありません。index.htmlからモデルを選択してARを開いてください。");
    } else {
      const src = toAssetUrl(rawFile);
      const ext = getExt(rawFile);

      fileText.textContent = rawFile;
      typeText.textContent = ext ? ext.toUpperCase().slice(1) : "---";

      if (ext !== ".glb" && ext !== ".gltf"){
        showMessage("このARビューアはGLB / GLTF推奨です。OBJ / FBXの場合は表示できない可能性があります。");
      }

      viewer.src = src;
      setStatus("LOADING");
    }

    viewer.addEventListener("load", () => setStatus("LOADED"));
    viewer.addEventListener("error", () => {
      setStatus("LOAD ERROR");
      showMessage("モデルの読み込みに失敗しました。GLBにテクスチャが埋め込まれているか、パスが正しいか確認してください。");
    });
    viewer.addEventListener("ar-status", event => {
      setStatus("AR " + event.detail.status);
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      location.href = location.origin + "/index.html";
    });

    document.getElementById("webxrBtn").addEventListener("click", () => {
      if (!rawFile){
        alert("モデルが選択されていません。");
        return;
      }
      location.href = location.origin + "/webxr_ar.html?file=" + encodeURIComponent(rawFile);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      viewer.cameraOrbit = "0deg 75deg auto";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
      setStatus("VIEW RESET");
    });

    document.getElementById("rotateBtn").addEventListener("click", () => {
      viewer.autoRotate = !viewer.autoRotate;
      setStatus(viewer.autoRotate ? "AUTO ROTATE ON" : "AUTO ROTATE OFF");
    });

    document.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-target");
        const panel = document.getElementById(id);
        panel.classList.toggle("collapsed");
        btn.textContent = panel.classList.contains("collapsed") ? "+" : "−";
      });
    });
  </script>
</body>
</html>
