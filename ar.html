<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AR教材ビューアー - Natural Teaching UI</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs"></script>

  <style>
    :root{
      --panel:rgba(8,16,32,.88);
      --cyan:#22f8ff;
      --lime:#a6ff2d;
      --magenta:#ff2deb;
      --text:#eafbff;
      --sub:#96a8c8;
      --line:rgba(34,248,255,.34);
      --shadow:0 0 18px rgba(34,248,255,.18),0 0 30px rgba(255,45,235,.08);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(34,248,255,.10), transparent 28%),
        radial-gradient(circle at 86% 76%, rgba(255,45,235,.10), transparent 32%),
        linear-gradient(135deg,#02030a,#061020 58%,#050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:50;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,248,255,.022) 1px,transparent 1px);
      background-size:4px 4px,18px 18px;
      mix-blend-mode:screen;
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    .storage-check{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:0;
      height:0;
    }

    .storage-label{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
      white-space:nowrap;
      user-select:none;
    }

    .storage-label:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    .storage-label .closed{
      display:none;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf,
    #focusViewer:checked ~ .refbar .storage-label.focus{
      border-color:rgba(166,255,45,.62)!important;
      color:var(--lime)!important;
      box-shadow:0 0 16px rgba(166,255,45,.16)!important;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object .opened,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf .opened,
    #focusViewer:checked ~ .refbar .storage-label.focus .opened{
      display:none;
    }

    #hideObjectSide:checked ~ .refbar .storage-label.object .closed,
    #hidePdfSide:checked ~ .refbar .storage-label.pdf .closed,
    #focusViewer:checked ~ .refbar .storage-label.focus .closed{
      display:inline;
    }

    #hideObjectSide:checked ~ #objectSide,
    #hidePdfSide:checked ~ #pdfSide,
    #focusViewer:checked ~ #objectSide,
    #focusViewer:checked ~ #pdfSide{
      display:none!important;
    }

    model-viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:transparent;
      --poster-color:transparent;
      --progress-bar-color:#22f8ff;
      --progress-bar-height:3px;
    }

    .refbar{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:20;
      border:1px solid var(--line);
      background:linear-gradient(90deg,rgba(8,16,32,.86),rgba(12,28,56,.64));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
    }

    .refbar-head{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      min-height:48px;
    }

    .rgb-line{
      height:3px;
      margin-bottom:6px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.60);
    }

    .title{
      font-size:17px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .subtitle{
      margin-top:3px;
      color:var(--sub);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .refbar-body{
      display:grid;
      grid-template-columns:1.4fr auto 1fr auto auto;
      gap:8px;
      padding:0 12px 10px;
      align-items:end;
    }

    .refbar.collapsed .refbar-body{
      display:none;
    }


    .side-storage-bar{
      position:absolute;
      top:76px;
      left:50%;
      transform:translateX(-50%);
      z-index:23;
      width:min(760px,calc(100vw - 20px));
      min-height:44px;
      border:1px solid rgba(34,248,255,.34);
      background:rgba(4,10,20,.84);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      padding:6px;
    }

    .side-storage-bar .storage-label{
      min-height:32px;
      font-size:12px;
    }

    .side{
      position:absolute;
      top:128px;
      bottom:86px;
      width:min(340px,calc(50vw - 18px));
      z-index:12;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .side.left{left:10px}
    .side.right{right:10px}

    .side-head{
      padding:10px 12px;
      border-bottom:1px solid rgba(34,248,255,.20);
      background:linear-gradient(90deg,rgba(34,248,255,.10),rgba(255,45,235,.07));
      color:var(--cyan);
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .side-body{
      padding:10px;
      overflow:auto;
      min-height:0;
      flex:1 1 auto;
    }

    .playbar{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:22;
      min-height:66px;
      border:1px solid var(--line);
      background:rgba(4,10,20,.84);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:auto auto 1fr auto auto auto;
      gap:8px;
      align-items:center;
      padding:8px;
    }

    .speedbox{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      align-items:center;
      min-width:260px;
    }

    button,.btn{
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
    }

    button:hover,.btn:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    button.lime,.btn.lime{
      border-color:rgba(166,255,45,.52);
      color:var(--lime);
    }

    button.magenta,.btn.magenta{
      border-color:rgba(255,45,235,.52);
      color:#ffd4fb;
    }

    input,select{
      width:100%;
      min-height:34px;
      border:1px solid rgba(34,248,255,.35);
      background:rgba(1,5,14,.88);
      color:var(--text);
      padding:6px 8px;
      outline:none;
      font-size:13px;
    }

    input[type="range"]{
      accent-color:var(--lime);
      padding:0;
    }

    label{
      color:var(--sub);
      font-size:11px;
      display:block;
      margin:8px 0 3px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .status{
      margin-top:8px;
      border:1px solid rgba(166,255,45,.26);
      background:rgba(166,255,45,.045);
      color:var(--lime);
      padding:8px;
      font-size:12px;
      line-height:1.45;
      word-break:break-all;
      font-family:Consolas,"MS UI Gothic",monospace;
    }

    .info-row{
      display:grid;
      grid-template-columns:86px 1fr;
      gap:8px;
      padding:5px 0;
      border-bottom:1px solid rgba(34,248,255,.08);
      font-size:12px;
    }

    .info-row .k{color:var(--sub)}
    .info-row .v{word-break:break-all}

    .pdf-preview{
      width:100%;
      aspect-ratio:1.414/1;
      object-fit:contain;
      background:white;
      border:1px solid rgba(34,248,255,.35);
      margin-top:8px;
      opacity:.85;
      transform-origin:top left;
    }

    .ar-button{
      position:absolute;
      left:50%;
      bottom:96px;
      transform:translateX(-50%);
      z-index:18;
      min-width:min(420px,calc(100vw - 48px));
      min-height:54px;
      border:2px solid rgba(166,255,45,.72);
      background:linear-gradient(180deg,rgba(24,48,18,.92),rgba(4,14,8,.94));
      color:var(--lime);
      font-size:18px;
      font-weight:bold;
      letter-spacing:.10em;
      box-shadow:0 0 22px rgba(166,255,45,.22);
      cursor:pointer;
    }

    .mobile-dock,
    .mobile-quick-panel{
      display:none;
    }

    @media (max-width:980px){
      html,body{overflow:hidden;height:100%}

      #app{
        position:fixed;
        inset:0;
        height:100dvh;
        min-height:0;
        overflow:hidden;
        padding:0;
        background:#02030a;
      }

      model-viewer{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        min-height:0;
        border:none;
        margin:0;
      }

      .refbar,.side-storage-bar,.side,.playbar{display:none}

      .refbar.mobile-open,
      .side.mobile-open,
      .playbar.mobile-open{
        display:flex;
        position:absolute;
        left:8px;
        right:8px;
        top:72px;
        bottom:76px;
        width:auto;
        max-height:none;
        margin:0;
        transform:none;
        z-index:45;
        overflow:auto;
      }

      .refbar.mobile-open{
        display:block;
        bottom:auto;
        max-height:58dvh;
        clip-path:none;
      }

      .refbar.mobile-open .refbar-head{grid-template-columns:1fr}
      .refbar.mobile-open .refbar-body{grid-template-columns:1fr}
      .side.mobile-open{display:flex}

      .playbar.mobile-open{
        display:grid;
        top:auto;
        bottom:76px;
        min-height:0;
        grid-template-columns:1fr 1fr;
        align-items:stretch;
      }

      .playbar.mobile-open .speedbox,
      .playbar.mobile-open select{
        grid-column:1/-1;
        min-width:0;
      }

      .ar-button{display:none}

      .mobile-dock{
        display:grid;
        position:absolute;
        left:8px;
        right:8px;
        bottom:8px;
        z-index:60;
        grid-template-columns:repeat(5,1fr);
        gap:6px;
        padding:6px;
        border:1px solid rgba(34,248,255,.34);
        background:rgba(4,10,20,.88);
        box-shadow:var(--shadow);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
      }

      .mobile-dock button{
        min-height:44px;
        padding:0 3px;
        font-size:10.5px;
        letter-spacing:0;
      }

      .mobile-quick-panel{
        display:none;
        position:absolute;
        left:8px;
        right:8px;
        bottom:76px;
        z-index:58;
        border:1px solid rgba(34,248,255,.34);
        background:rgba(4,10,20,.94);
        box-shadow:var(--shadow);
        padding:8px;
        grid-template-columns:repeat(2,1fr);
        gap:8px;
        border-radius:10px;
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
      }

      .mobile-quick-panel.mobile-open{display:grid}
      .mobile-quick-panel button{min-height:42px;font-size:12px}
      .title{font-size:13px}
    }
  
    /* ============================================================
       v61 DARK TECHNICAL UI OVERRIDE
       3D / AR 共通デザイン
       ============================================================ */

    :root{
      --bg:#05070d;
      --bg2:#080d16;
      --panel:rgba(13,19,32,.90);
      --panel2:rgba(17,27,43,.94);
      --panel3:rgba(7,12,22,.86);
      --cyan:#38ddf8;
      --cyan2:#7dd3fc;
      --lime:#7ef29a;
      --magenta:#9f7aea;
      --yellow:#eab308;
      --text:#eafbff;
      --sub:#95a3b8;
      --muted:#64748b;
      --line:rgba(125,211,252,.22);
      --line2:rgba(148,163,184,.20);
      --danger:#ff5d7a;
      --shadow:0 18px 46px rgba(0,0,0,.38),0 0 0 1px rgba(125,211,252,.055);
      --radius:12px;
      --radius2:9px;
    }

    html,body{
      background:
        radial-gradient(circle at 20% 12%, rgba(56,221,248,.075), transparent 30%),
        radial-gradient(circle at 78% 80%, rgba(159,122,234,.060), transparent 34%),
        linear-gradient(135deg,#05070d 0%,#070c15 46%,#03050b 100%) !important;
      color:var(--text) !important;
      font-family:"Yu Gothic UI","Meiryo","MS UI Gothic",sans-serif !important;
    }

    body::before{
      opacity:.24 !important;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(125,211,252,.016) 1px,transparent 1px) !important;
      background-size:6px 6px,24px 24px !important;
      mix-blend-mode:screen !important;
    }

    body::after{
      opacity:.12 !important;
      background:linear-gradient(to bottom,rgba(255,255,255,.025),transparent 1px) !important;
      background-size:100% 6px !important;
    }

    #viewer,
    model-viewer{
      background:
        radial-gradient(circle at center,rgba(125,211,252,.05),transparent 34%),
        linear-gradient(180deg,rgba(8,13,22,.10),rgba(3,5,10,.20)) !important;
    }

    .refbar,
    .side,
    .side-storage-bar,
    .playbar,
    .view-hud,
    .mobile-dock,
    .mobile-quick-panel,
    .ar-button{
      border:1px solid var(--line) !important;
      background:
        linear-gradient(180deg,rgba(17,27,43,.92),rgba(8,13,22,.88)) !important;
      box-shadow:var(--shadow) !important;
      backdrop-filter:blur(14px) saturate(125%) !important;
      -webkit-backdrop-filter:blur(14px) saturate(125%) !important;
      border-radius:var(--radius) !important;
      clip-path:none !important;
    }

    .refbar{
      top:12px !important;
      left:12px !important;
      right:12px !important;
      overflow:hidden !important;
    }

    .refbar-head{
      min-height:50px !important;
      padding:9px 14px !important;
      background:linear-gradient(90deg,rgba(56,221,248,.075),rgba(159,122,234,.040),transparent) !important;
      border-bottom:1px solid rgba(125,211,252,.10) !important;
    }

    .refbar-body{
      padding:10px 14px 12px !important;
    }

    .rgb-line{
      height:2px !important;
      margin-bottom:7px !important;
      background:linear-gradient(90deg,rgba(56,221,248,.92),rgba(125,211,252,.30),rgba(126,242,154,.65)) !important;
      box-shadow:none !important;
      border-radius:999px !important;
    }

    .title{
      color:var(--text) !important;
      font-size:16px !important;
      letter-spacing:.10em !important;
      text-shadow:none !important;
    }

    .subtitle{
      color:var(--sub) !important;
      letter-spacing:.025em !important;
    }

    .side-head{
      color:var(--cyan2) !important;
      text-shadow:none !important;
      background:
        linear-gradient(90deg,rgba(56,221,248,.085),rgba(148,163,184,.035),transparent) !important;
      border-bottom:1px solid rgba(125,211,252,.12) !important;
      border-radius:var(--radius) var(--radius) 0 0 !important;
      letter-spacing:.10em !important;
    }

    .side-body{
      scrollbar-color:rgba(125,211,252,.36) rgba(7,12,22,.4);
    }

    .status{
      color:var(--sub) !important;
      background:rgba(7,12,22,.72) !important;
      border:1px solid rgba(148,163,184,.15) !important;
      border-radius:var(--radius2) !important;
      line-height:1.45 !important;
    }

    label{
      color:var(--sub) !important;
      font-weight:700 !important;
      letter-spacing:.045em !important;
    }

    input,
    select,
    textarea{
      color:var(--text) !important;
      background:rgba(5,8,14,.88) !important;
      border:1px solid rgba(148,163,184,.22) !important;
      border-radius:8px !important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035) !important;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:rgba(56,221,248,.66) !important;
      box-shadow:0 0 0 2px rgba(56,221,248,.10), inset 0 1px 0 rgba(255,255,255,.04) !important;
    }

    input[type="range"]{
      accent-color:var(--cyan) !important;
      box-shadow:none !important;
    }

    button,
    .btn,
    .storage-label{
      min-height:38px;
      color:var(--text) !important;
      border:1px solid rgba(125,211,252,.24) !important;
      background:
        linear-gradient(180deg,rgba(20,31,49,.96),rgba(8,13,22,.96)) !important;
      border-radius:9px !important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.055) !important;
      text-shadow:none !important;
      letter-spacing:.045em !important;
      transition:
        border-color .16s ease,
        background .16s ease,
        box-shadow .16s ease,
        transform .08s ease,
        color .16s ease !important;
    }

    button:hover,
    .btn:hover,
    .storage-label:hover{
      border-color:rgba(56,221,248,.72) !important;
      background:
        linear-gradient(180deg,rgba(26,43,66,.98),rgba(9,17,29,.98)) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 0 2px rgba(56,221,248,.10) !important;
      transform:translateY(-1px);
    }

    button:active,
    .btn:active,
    .storage-label:active{
      transform:translateY(0);
      background:linear-gradient(180deg,rgba(8,13,22,.98),rgba(20,31,49,.98)) !important;
    }

    button.lime,
    .btn.lime{
      color:var(--lime) !important;
      border-color:rgba(126,242,154,.36) !important;
      background:linear-gradient(180deg,rgba(16,38,31,.96),rgba(7,20,17,.96)) !important;
    }

    button.lime:hover,
    .btn.lime:hover{
      border-color:rgba(126,242,154,.70) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 0 2px rgba(126,242,154,.10) !important;
    }

    button.magenta,
    .btn.magenta{
      color:#e8ddff !important;
      border-color:rgba(159,122,234,.38) !important;
      background:linear-gradient(180deg,rgba(38,28,58,.96),rgba(17,11,29,.96)) !important;
    }

    button.magenta:hover,
    .btn.magenta:hover{
      border-color:rgba(159,122,234,.72) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 0 2px rgba(159,122,234,.12) !important;
    }

    .view-hud{
      color:var(--cyan2) !important;
      border-color:rgba(126,242,154,.32) !important;
      background:rgba(7,12,22,.78) !important;
      letter-spacing:.06em !important;
    }

    .view-hud .hud-sub{
      color:var(--muted) !important;
    }

    .playbar{
      background:
        linear-gradient(180deg,rgba(13,19,32,.92),rgba(5,8,14,.90)) !important;
      min-height:68px !important;
    }

    .mobile-dock{
      background:rgba(7,12,22,.92) !important;
      border-radius:14px !important;
      padding:7px !important;
    }

    .mobile-quick-panel{
      background:rgba(7,12,22,.94) !important;
      border-radius:14px !important;
    }

    .ar-button{
      color:var(--text) !important;
      background:linear-gradient(180deg,rgba(20,31,49,.96),rgba(8,13,22,.96)) !important;
      border-color:rgba(56,221,248,.42) !important;
    }

    .pdf-page,
    canvas{
      border-radius:6px;
    }

    .pdf-page{
      box-shadow:0 12px 30px rgba(0,0,0,.28) !important;
    }

    @media (max-width:980px){
      .view-hud{
        background:rgba(7,12,22,.58) !important;
        border-color:rgba(125,211,252,.18) !important;
      }

      .mobile-dock button{
        min-height:46px !important;
        font-size:10.5px !important;
      }

      .mobile-quick-panel{
        bottom:78px !important;
      }
    }

  
    /* v61: ARスマホ時のPDF表示・モデル切替補助 */
    @media (max-width:980px){
      #pdfSide.mobile-open,
      #objectSide.mobile-open{

    async function copyTextToClipboard(text){
      try{
        if (navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
          return true;
        }
      }catch(err){
        console.warn("clipboard api failed", err);
      }

      try{
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        return ok;
      }catch(err){
        console.warn("fallback copy failed", err);
        return false;
      }
    }

    async function handleReturnFromAR(reason="return"){
      let pending = null;

      try{
        const raw = localStorage.getItem(AR_PENDING_KEY);
        pending = raw ? JSON.parse(raw) : null;
      }catch(err){
        pending = null;
      }

      if (!pending && !arLaunchPending) return;

      if (pending && pending.ts && Date.now() - pending.ts > 1000 * 60 * 20){
        clearArLaunchPending();
        return;
      }

      const shouldNext = autoAdvanceAfterAR || (pending && pending.afterNext);

      clearArLaunchPending();

      if (shouldNext && chapters.length > 0){
        setObjectStatus("ARから戻りました。次CHへ進みます。");
        await changeChapter(1);
      }else{
        setObjectStatus("ARから戻りました。現在CHを保持しています。");

    function normalizePath(path){
      return String(path || "").trim().replace(/\\/g,"/").replace(/^\/+/,"").replace(/\/+$/,"");
    }

    function encodePath(path){
      return normalizePath(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      const assetPath = encodePath(path);
      if (location.protocol === "file:"){
        return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_REF}/${assetPath}`;
      }
      return `${location.origin}/${assetPath}`;
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function getBaseName(path){
      return String(path).split("/").pop() || path;
    }

    async function fetchGitHubContents(path){
      const safePath = path ? "/" + encodePath(path) : "";
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents${safePath}?ref=${encodeURIComponent(GITHUB_REF)}&_=${Date.now()}`;
      const res = await fetch(url, {headers:{"Accept":"application/vnd.github+json"}});
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${path || "/"}`);
      return await res.json();
    }

    function pdfRoleScore(path, role){
      const name = getBaseName(path).toLowerCase();

      if (role === "floor"){
        if (name.includes("平面") || name.includes("床") || name.includes("floor") || name.includes("ground") || name.includes("plan")) return 100;
        if (name.includes("base") || name.includes("ベース")) return 50;
        return 0;
      }

      if (role === "side"){
        if (name.includes("側面") || name.includes("立面") || name.includes("壁") || name.includes("side") || name.includes("wall") || name.includes("elevation")) return 100;
        return 0;
      }

      return 0;
    }

    function chooseFloorAndSidePdfs(pdfFiles){
      const pdfs = [...pdfFiles].sort((a,b) => a.path.localeCompare(b.path, "ja"));
      if (pdfs.length === 0) return { floorPdf:"", sidePdf:"", pdfs:[] };

      let floor = pdfs[0];
      let side = pdfs.length >= 2 ? pdfs[1] : null;

      const floorCandidate = [...pdfs].sort((a,b) => pdfRoleScore(b.path, "floor") - pdfRoleScore(a.path, "floor"))[0];
      if (floorCandidate && pdfRoleScore(floorCandidate.path, "floor") > 0) floor = floorCandidate;

      const sideCandidate = [...pdfs]
        .filter(p => p.path !== floor.path)
        .sort((a,b) => pdfRoleScore(b.path, "side") - pdfRoleScore(a.path, "side"))[0];

      if (sideCandidate && (pdfRoleScore(sideCandidate.path, "side") > 0 || pdfs.length >= 2)) side = sideCandidate;

      return {
        floorPdf: floor ? floor.path : "",
        sidePdf: side ? side.path : "",
        pdfs: pdfs.map(p => p.path)
      };
    }

    async function scanChapter(chapterPath){
      const items = await fetchGitHubContents(chapterPath);
      const files = Array.isArray(items) ? items.filter(item => item.type === "file") : [];
      const glbModel = files.find(f => GLB_EXTS.includes(getExt(f.path))) || null;
      const usdzModel = files.find(f => USDZ_EXTS.includes(getExt(f.path))) || null;
      const fallbackModel = files.find(f => MODEL_EXTS.includes(getExt(f.path))) || null;
      const pdfFiles = files.filter(f => PDF_EXTS.includes(getExt(f.path)));
      const textFile = files.find(f => TXT_EXTS.includes(getExt(f.path))) || null;
      const chosen = chooseFloorAndSidePdfs(pdfFiles);

      return {
        name:getBaseName(chapterPath),
        path:chapterPath,
        model:glbModel ? glbModel.path : (fallbackModel ? fallbackModel.path : ""),
        iosModel:usdzModel ? usdzModel.path : "",
        pdf:chosen.floorPdf,
        floorPdf:chosen.floorPdf,
        sidePdf:chosen.sidePdf,
        pdfs:chosen.pdfs,
        textPath:textFile ? textFile.path : "",
        files:files.map(f => f.path)
      };
    }


    /* AR_CH_MANIFEST_HELPER_V1: root manifest + per-CH manifest fallback. */
    async function fetchViewerManifest(root){
      const manifestPath = normalizePath(root) + "/viewer_manifest.json";
      const manifestUrl = toAssetUrl(manifestPath);
      const url = manifestUrl + (manifestUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url, {cache:"no-store"});
      if (!res.ok) throw new Error("viewer_manifest " + res.status);
      const data = await res.json();
      const list = Array.isArray(data.chapters) ? data.chapters : [];
      return list.map(ch => ({
        name: ch.name || getBaseName(ch.path || ""),
        path: normalizePath(ch.path || (normalizePath(root) + "/" + (ch.name || ""))),
        model: normalizePath(ch.model || ch.glb || ch.gltf || ""),
        iosModel: normalizePath(ch.iosModel || ch.usdz || ""),
        pdf: normalizePath(ch.pdf || ch.floorPdf || ""),
        floorPdf: normalizePath(ch.floorPdf || ch.pdf || ""),
        sidePdf: normalizePath(ch.sidePdf || ""),
        pdfs: Array.isArray(ch.pdfs) ? ch.pdfs.map(normalizePath) : [],
        textPath: normalizePath(ch.textPath || ch.txt || ""),
        files: Array.isArray(ch.files) ? ch.files.map(normalizePath) : []
      }));
    }

    async function fetchChapterManifest(root, chapterName){
      const chapterRoot = normalizePath(root) + "/" + chapterName;
      const manifestPath = chapterRoot + "/viewer_manifest.json";
      const manifestUrl = toAssetUrl(manifestPath);
      const url = manifestUrl + (manifestUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url, {cache:"no-store"});
      if (!res.ok) return null;
      const data = await res.json();
      const withRoot = p => {
        const v = String(p || "").trim();
        if (!v) return "";
        return v.includes("/") ? normalizePath(v) : chapterRoot + "/" + v;
      };
      const files = [];
      const addFile = p => { const v = withRoot(p); if (v && !files.includes(v)) files.push(v); };
      const explicitFiles = data.files || data.items || data.assets || data.entries || [];
      explicitFiles.forEach(addFile);
      [data.model, data.glb, data.gltf, data.iosModel, data.usdz, data.pdf, data.floorPdf, data.sidePdf, data.textPath, data.txt].forEach(addFile);
      (data.pdfs || data.pdfFiles || []).forEach(addFile);
      const findExt = exts => files.find(p => exts.includes(getExt(p))) || "";
      const pdfs = [...new Set((data.pdfs || data.pdfFiles || files.filter(p => PDF_EXTS.includes(getExt(p)))).map(withRoot).filter(Boolean))];
      const chosen = chooseFloorAndSidePdfs(pdfs.map(p => ({path:p})));
      return {
        name: chapterName,
        path: chapterRoot,
        model: withRoot(data.model || data.glb || data.gltf) || findExt(GLB_EXTS) || findExt(MODEL_EXTS),
        iosModel: withRoot(data.iosModel || data.usdz) || findExt(USDZ_EXTS),
        pdf: withRoot(data.pdf) || chosen.floorPdf,
        floorPdf: withRoot(data.floorPdf) || chosen.floorPdf,
        sidePdf: withRoot(data.sidePdf) || chosen.sidePdf,
        pdfs: chosen.pdfs,
        textPath: withRoot(data.textPath || data.txt) || findExt(TXT_EXTS),
        files
      };
    }

    function ensureExpectedChapters(list, root){
      const result = Array.isArray(list) ? [...list] : [];
      const expected = Array.from({length:60}, (_v, i) => "CH" + String(i + 1).padStart(2, "0"));
      expected.forEach(name => {
        if (!result.some(ch => ch.name === name)) result.push({name, path: normalizePath(root) + "/" + name, model:"", iosModel:"", pdf:"", floorPdf:"", sidePdf:"", pdfs:[], textPath:"", files:[]});
      });
      result.sort((a,b)=>String(a.name || "").localeCompare(String(b.name || ""), "ja", {numeric:true}));
      return result;
    }

    async function mergeChapterManifests(root, baseList){
      const result = Array.isArray(baseList) ? [...baseList] : [];
      const expected = Array.from({length:60}, (_v, i) => "CH" + String(i + 1).padStart(2, "0"));
      await Promise.all(expected.map(async name => {
        try{
          const ch = await fetchChapterManifest(root, name);
          if (!ch) return;
          const idx = result.findIndex(item => item.name === name);
          if (idx >= 0) result[idx] = {...result[idx], ...ch};
          else result.push(ch);
        }catch(err){ console.warn("chapter manifest skipped:", name, err.message); }
      }));
      return ensureExpectedChapters(result, root);
    }

    async function scanRoot(root){
      root = normalizePath(root);
      try{
        const manifestChapters = await fetchViewerManifest(root);
        return await mergeChapterManifests(root, manifestChapters);
      }catch(manifestErr){
        console.warn("viewer_manifest fallback to GitHub API:", manifestErr.message);
      }
      const items = await fetchGitHubContents(root);
      const dirs = Array.isArray(items) ? items.filter(item => item.type === "dir") : [];
      const result = [];
      for (const d of dirs){
        const ch = await scanChapter(d.path);
        if (ch.model || ch.iosModel || ch.pdf) result.push(ch);
      }
      result.sort((a,b) => a.name.localeCompare(b.name, "ja"));
      return await mergeChapterManifests(root, result);
    }

    async function autoDetectRoot(){
      for (const candidate of ROOT_CANDIDATES){
        try{
          const result = await scanRoot(candidate);
          if (result.length > 0){
            rootInput.value = candidate;
            chapters = result;
            currentRoot = candidate;
            populateChapters();
            setObjectStatus(`参照フォルダ検出: ${candidate}`);
            return true;
          }
        }catch(err){
          console.warn("root skipped:", candidate, err.message);
        }
      }

      setObjectStatus("参照フォルダが見つかりません。");
      return false;
    }

    function populateChapters(){

    function normalizeChapterName(name){
      const raw = String(name || "").trim();
      const match = raw.match(/CH\s*0*(\d+)/i);
      if (!match) return raw;
      return "CH" + String(parseInt(match[1], 10)).padStart(2, "0");
    }

    function getCurrentChapterName(){
      const ch = chapters[currentChapterIndex];
      return ch ? String(ch.name || "") : "";
    }

    function getChapterTargetScale(){
      const key = normalizeChapterName(getCurrentChapterName());
      return CHAPTER_TARGET_SCALE_MAP[key] || CHAPTER_BASELINE_TARGET_SCALE;
    }

    function updateChapterCorrectionStatus(){
      chapterCorrectionFactor = chapterCorrectionEnabled
        ? (getChapterTargetScale() / CHAPTER_BASELINE_TARGET_SCALE)
        : 1.0;

      const chName = normalizeChapterName(getCurrentChapterName()) || "未選択";
      const target = getChapterTargetScale();
      const factorText = chapterCorrectionFactor.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");

      if (chapterCorrectionStatus){
        chapterCorrectionStatus.textContent =
          `ARモデル補正: ${chapterCorrectionEnabled ? "ON" : "OFF"} / ${chName} / PDFは1/20→1/70固定 / モデルだけ×${factorText} / 参考:${target}`;
      }

      if (chapterCorrectionBtn){
        chapterCorrectionBtn.textContent = chapterCorrectionEnabled ? "モデル補正ON" : "モデル補正OFF";
        chapterCorrectionBtn.classList.toggle("lime", chapterCorrectionEnabled);
      }

      if (viewer){
        viewer.setAttribute("scale", `${chapterCorrectionFactor} ${chapterCorrectionFactor} ${chapterCorrectionFactor}`);
      }
    }

    async function loadChapterText(chapter){
      if (!chapterTextPathText || !chapterTextBox) return;
      const textPath = chapter && chapter.textPath ? chapter.textPath : "";
      chapterTextPathText.textContent = textPath || "未登録";
      if (!textPath){
        chapterTextBox.textContent = "このチャプターに解説TXTはありません。";
        return;
      }
      try{
        chapterTextBox.textContent = "解説文を読み込み中...";
        const res = await fetch(toAssetUrl(textPath), {cache:"no-store"});
        if (!res.ok) throw new Error("TXT " + res.status + ": " + textPath);
        const text = await res.text();
        chapterTextBox.textContent = text.trim() || "解説TXTは空です。";
      }catch(err){
        console.error(err);
        chapterTextBox.textContent = "解説TXTの読み込みに失敗しました。\n" + textPath + "\n" + err.message;
      }

    async function loadChapter(index){
      if (index < 0 || index >= chapters.length) return;

      currentChapterIndex = index;
      const ch = chapters[index];
      chapterSelect.value = String(index);

      chapterNameText.textContent = ch.name;
      modelPathText.textContent = ch.model || "未登録";
      iosModelPathText.textContent = ch.iosModel || "未登録";
      updateChapterCorrectionStatus();
      pdfFloorPathText.textContent = ch.floorPdf || "未登録";
      pdfSidePathText.textContent = ch.sidePdf || "未登録";

      await loadChapterText(ch);

      if (ch.model || ch.iosModel) await loadModel(ch.model, ch.iosModel);

      pdfFloorPreview.removeAttribute("src");
      pdfSidePreview.removeAttribute("src");
      setPdfStatus("PDF読込OFF");

      updateUrlState();
    }

    function updateUrlState(){
      const url = new URL(location.href);
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (chapters[currentChapterIndex]) url.searchParams.set("chapter", chapters[currentChapterIndex].name);
      history.replaceState(null, "", url.toString());
      saveCurrentViewerState();
    }

    async function loadModel(path, iosPath=""){
      currentModel = path || "";
      currentIosModel = iosPath || "";

      updateChapterCorrectionStatus();

      if (currentModel && GLB_EXTS.includes(getExt(currentModel))){
        const modelUrl = toAssetUrl(currentModel);
        viewer.setAttribute("src", modelUrl);
        viewer.src = modelUrl;
      } else if (currentIosModel){
        // USDZしか無い場合、iPhone AR用として保持する。
        // 3DプレビューにはGLB/GLTFが必要なので、プレビューは未設定になる。
        viewer.removeAttribute("src");
      } else {
        viewer.removeAttribute("src");
      }

      if (currentIosModel){
        viewer.setAttribute("ios-src", toAssetUrl(currentIosModel));
      } else {
        viewer.removeAttribute("ios-src");
      }

      const iosText = currentIosModel ? ` / iOS USDZあり` : ` / iOS USDZなし`;
      setObjectStatus(`MODEL LOADING: ${currentModel || "GLBなし"}${iosText} / AR補正×${chapterCorrectionFactor.toFixed(4)}`);
    }

    async function loadPdfPreview(path, targetImage){
      try{
        setPdfStatus("PDF LOADING: " + path);
        const ext = getExt(path);

        if (ext === ".pdf"){
          const task = pdfjsLib.getDocument(toAssetUrl(path));
          const pdf = await task.promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({scale:1.2});
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d", {alpha:false});
          ctx.fillStyle = "#fff";
          ctx.fillRect(0,0,canvas.width,canvas.height);
          await page.render({canvasContext:ctx, viewport}).promise;
          targetImage.src = canvas.toDataURL("image/png");
        } else {
          targetImage.src = toAssetUrl(path);
        }

        applyPdfScaleConversion();
        setPdfStatus("PDF PREVIEW: " + path + " / 初期プレビュー倍率 28.571%");
      }catch(err){
        console.error(err);
        setPdfStatus("PDF PREVIEW ERROR");
      }
    }



    async function loadChapterPdfPreviews(chapter){
      pdfFloorPreview.removeAttribute("src");
      pdfSidePreview.removeAttribute("src");

      const floorPdf = chapter.floorPdf || (chapter.pdfs && chapter.pdfs.length > 0 ? chapter.pdfs[0] : "");
      const sidePdf = chapter.sidePdf || (chapter.pdfs && chapter.pdfs.length > 1 ? chapter.pdfs.find(p => p !== floorPdf) : "");

      pdfFloorPathText.textContent = floorPdf || "未登録";
      pdfSidePathText.textContent = sidePdf || "未登録";

      const jobs = [];
      if (floorPdf) jobs.push(loadPdfPreview(floorPdf, pdfFloorPreview));
      if (sidePdf && sidePdf !== floorPdf) jobs.push(loadPdfPreview(sidePdf, pdfSidePreview));

      if (jobs.length === 0){
        setPdfStatus("このチャプターにPDFはありません。");
        return;
      }

      await Promise.all(jobs);
      applyPdfScaleConversion();
      setPdfStatus(`PDF PREVIEW: ${jobs.length}枚 / 床 ${floorPdf ? getBaseName(floorPdf) : "なし"} / 側面 ${sidePdf ? getBaseName(sidePdf) : "なし"}`);
    }

    function formatScaleNumber(value){
      const n = Number(value) || 0;
      if (Math.abs(n - Math.round(n)) < 0.000001) return String(Math.round(n));
      return n.toFixed(3).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function updatePdfScaleReadout(currentScale, targetScale, percent){
      if (!pdfScaleReadout) return;
      if (!currentScale || !targetScale || !percent){
        pdfScaleReadout.textContent = "縮尺換算: 未設定";
        return;
      }

      pdfScaleReadout.textContent =
        `縮尺換算: 1/${formatScaleNumber(currentScale)} → 1/${formatScaleNumber(targetScale)} = プレビュー倍率 ${formatScaleNumber(percent)}%`;
    }

    function applyPdfScaleConversion(){
      const currentScale = parseFloat(pdfCurrentScaleInput.value) || 0;
      const targetScale = parseFloat(pdfTargetScaleInput.value) || 0;

      if (currentScale <= 0 || targetScale <= 0){
        alert("縮尺は 100 や 50 のように、1/○ の分母だけ入力してください。");
        return;
      }

      const percent = Math.max(1, Math.min(5000, 100 * currentScale / targetScale));
      pdfFloorPreview.style.transform = `scale(${percent / 100})`;
      pdfSidePreview.style.transform = `scale(${percent / 100})`;
      pdfFloorPreview.style.marginBottom = `${Math.max(0, percent - 100) * 0.25}px`;
      pdfSidePreview.style.marginBottom = `${Math.max(0, percent - 100) * 0.25}px`;
      updatePdfScaleReadout(currentScale, targetScale, percent);
      setPdfStatus(`縮尺反映: 1/${formatScaleNumber(currentScale)} → 1/${formatScaleNumber(targetScale)} / プレビュー倍率 ${formatScaleNumber(percent)}%`);
    }

    function resetPdfScaleConversion(){
      pdfCurrentScaleInput.value = "20";
      pdfTargetScaleInput.value = "70";
      pdfFloorPreview.style.transform = "scale(0.28571)";
      pdfSidePreview.style.transform = "scale(0.28571)";
      pdfFloorPreview.style.marginBottom = "0";
      pdfSidePreview.style.marginBottom = "0";
      updatePdfScaleReadout(20, 70, 28.571);
      setPdfStatus("縮尺初期化: 1/20 → 1/70 / プレビュー倍率 28.571%");
    }

    async function changeChapter(delta){
      if (chapters.length === 0) return;
      let next = currentChapterIndex + delta;
      if (next < 0) next = chapters.length - 1;
      if (next >= chapters.length) next = 0;
      await loadChapter(next);
    }

    async function playSelectedAnimation(name, restart=true){
      if (!name) return false;
      viewer.animationName = name;
      viewer.setAttribute("animation-name", name);
      viewer.timeScale = playSpeed;
      try{
        if (viewer.updateComplete) await viewer.updateComplete;
        if (restart) viewer.currentTime = 0;
        await viewer.play();
      }catch(err){
        console.warn("Animation play retry", err);
        setTimeout(() => {
          try{
            viewer.animationName = name;
            viewer.setAttribute("animation-name", name);
            viewer.timeScale = playSpeed;
            if (restart) viewer.currentTime = 0;
            viewer.play();
          }catch(e){ console.warn(e); }
        }, 250);
      }
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
      if (mobilePlayBtn) mobilePlayBtn.textContent = "停止";
      return true;
    }
    function refreshAnimations(){
      const animations = viewer.availableAnimations || [];
      animationSelect.innerHTML = "";

      if (animations.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "アニメーションなし";
        animationSelect.appendChild(opt);
        return;
      }

      for (const name of animations){
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        animationSelect.appendChild(opt);
      }

      animationSelect.value = animations[0];
      playSelectedAnimation(animations[0], true);
      playPauseBtn.textContent = "一時停止";
    }

    function setRecordingUi(isRecording){
      if (recordStartBtn) recordStartBtn.disabled = isRecording;
      if (recordStopBtn) recordStopBtn.disabled = !isRecording;
      if (mobileRecordStartBtn) mobileRecordStartBtn.disabled = isRecording;
      if (mobileRecordStopBtn) mobileRecordStopBtn.disabled = !isRecording;
      if (recordStartBtn) recordStartBtn.textContent = isRecording ? "録画中" : "録画開始";
      if (mobileRecordStartBtn) mobileRecordStartBtn.textContent = isRecording ? "録画中" : "録画開始";
    }

    function getRecordingMimeType(){
      const candidates = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      return candidates.find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || "";
    }

    async function startRecording(){
      if (mediaRecorder && mediaRecorder.state === "recording") return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder){
        alert("このブラウザでは録画機能が使えません。PC版Chrome/Edgeなどで試してください。");
        setObjectStatus("RECORDING UNSUPPORTED");
        return;
      }
      try{
        recordingStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: false
        });
        recordedChunks = [];
        const mimeType = getRecordingMimeType();
        mediaRecorder = new MediaRecorder(recordingStream, mimeType ? { mimeType } : undefined);
        mediaRecorder.addEventListener("dataavailable", event => {
          if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        });
        mediaRecorder.addEventListener("stop", saveRecording);
        recordingStream.getVideoTracks()[0]?.addEventListener("ended", stopRecording);
        mediaRecorder.start(250);
        setRecordingUi(true);
        setObjectStatus("録画中: ブラウザ画面を記録しています。");
      }catch(err){
        console.error(err);
        setRecordingUi(false);
        setObjectStatus("RECORDING CANCELLED");
      }
    }

    function stopRecording(){
      if (mediaRecorder && mediaRecorder.state !== "inactive"){
        mediaRecorder.stop();
      } else {
        saveRecording();
      }
    }

    function saveRecording(){
      setRecordingUi(false);
      if (recordingStream){
        recordingStream.getTracks().forEach(track => track.stop());
        recordingStream = null;
      }
      if (!recordedChunks.length){
        setObjectStatus("録画データがありません。");
        return;
      }
      const blob = new Blob(recordedChunks, { type: recordedChunks[0]?.type || "video/webm" });
      recordedChunks = [];
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const ch = chapters[currentChapterIndex]?.name || "chapter";
      a.href = url;
      a.download = `ar-viewer_${ch}_${new Date().toISOString().replace(/[:.]/g,"-")}.webm`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setObjectStatus("録画を保存しました: " + a.download);
    }
    async function openAR(){
      const shouldContinue = await askOpenInSafariIfNeeded();
      if (!shouldContinue) return;

      const ios = isIOSLike();
      const safari = isSafariLike();

      if (!currentModel && !currentIosModel){
        alert("先にチャプターを選んでモデルを読み込んでください。");
        return;
      }

      if (ios && !currentIosModel){
        alert("iPhone/iPadのARにはUSDZファイルが必要です。\n\nこのチャプターにはUSDZが見つかりません。\nChromeで試す場合も、同じCHフォルダ内に .usdz を入れてください。");
        setObjectStatus("iOS AR ERROR: USDZがありません。");
        return;
      }

      if (ios && !safari){
        setObjectStatus("iPhone Chromeで直接AR起動を試します。失敗時はUSDZ直接起動へ切替できます。");
      }

      try{
        markArLaunchPending();
        await viewer.activateAR();
        setObjectStatus(autoAdvanceAfterAR ? "AR起動要求を送信しました。戻ったら次CHへ進みます。" : "AR起動要求を送信しました。戻っても現在CHを保持します。");
      }catch(err){
        console.error(err);

        const ios = isIOSLike();
        const safari = isSafariLike();

        if (ios && !safari && currentIosModel){
          const ok = confirm(
            "iPhone ChromeでAR起動に失敗しました。\n\n" +
            "同じCHフォルダ内のUSDZを直接開いてARを試しますか？\n\n" +
            "OK: USDZを直接開く\n" +
            "キャンセル: 中止"
          );
          if (ok){
            openUsdZDirectly();
            return;
          }
        }

        clearArLaunchPending();

        alert(
          "AR起動に失敗しました。\n\n" +
          "iPhone Chromeでは端末やiOSの仕様により動かない場合があります。\n" +
          "USDZが入っているか、ファイルサイズが大きすぎないか確認してください。"
        );
        setObjectStatus("AR START ERROR");
      }
    }

    function open3D(){
      const ch = chapters[currentChapterIndex];
      const url = new URL(location.origin + location.pathname.replace(/\/[^\/]*$/, "/"));
      url.searchParams.set("v", "20260605_0043_v61");
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (ch) url.searchParams.set("chapter", ch.name);
      window.open(url.toString(), "_blank");
    }

    viewer.addEventListener("load", async () => {
      try{ if (viewer.updateComplete) await viewer.updateComplete; }catch(e){}
      refreshAnimations();
      setObjectStatus("読込完了: " + currentModel);
    });

    viewer.addEventListener("finished", () => {
      isPaused = true;
      playPauseBtn.textContent = "再生";
      if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      setObjectStatus("ANIMATION COMPLETE");
    });

    viewer.addEventListener("error", event => {
      console.error("model-viewer error", event.detail || event);
      setObjectStatus("MODEL LOAD ERROR: " + (currentModel || "GLBなし"));
    });

    viewer.addEventListener("ar-status", event => {
      setObjectStatus("AR STATUS: " + event.detail.status);
    });


    function closeMobilePanels(){
      refbar.classList.remove("mobile-open");
      objectSide.classList.remove("mobile-open");
      pdfSide.classList.remove("mobile-open");
      document.querySelector(".playbar")?.classList.remove("mobile-open");
      mobileQuickPanel?.classList.remove("mobile-open");
    }

    function openMobilePanel(panel){
      closeMobilePanels();

      if (panel === "quick"){
        mobileQuickPanel?.classList.add("mobile-open");
        return;
      }

      if (panel === "ref"){
        refbar.classList.add("mobile-open");
        return;
      }

      if (panel === "object"){
        objectSide.classList.add("mobile-open");
        return;
      }

      if (panel === "pdf"){
        pdfSide.classList.add("mobile-open");
        return;
      }

      if (panel === "anim"){
        document.querySelector(".playbar")?.classList.add("mobile-open");
      }
    }

    function toggleMobilePlay(){
      if (!currentModel) return alert("GLB/GLTFが無いため、3Dプレビュー再生はできません。iPhone AR用USDZのみ読み込まれている可能性があります。");
      if (isPaused){
        playSelectedAnimation(animationSelect.value || viewer.animationName, false);
      } else {
        viewer.pause();
        isPaused = true;
        playPauseBtn.textContent = "再生";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      }
    }

    collapseRefBtn.addEventListener("click", () => {
      refbar.classList.toggle("collapsed");
      collapseRefBtn.textContent = refbar.classList.contains("collapsed") ? "上部バー展開" : "上部バー収納";
    });

    scanBtn.addEventListener("click", loadReferenceRoot);
    autoRootBtn.addEventListener("click", autoDetectRoot);
    chapterSelect.addEventListener("change", () => loadChapter(parseInt(chapterSelect.value,10)));
    prevChapterBtn.addEventListener("click", () => changeChapter(-1));
    nextChapterBtn.addEventListener("click", () => changeChapter(1));
    prevBottomBtn.addEventListener("click", () => changeChapter(-1));

    arStartBtn.addEventListener("click", openAR);
    recordStartBtn?.addEventListener("click", startRecording);
    recordStopBtn?.addEventListener("click", stopRecording);
    modelUrlBtn.addEventListener("click", () => {
      if (!currentModel) return alert("GLB/GLTFモデル未読込");
      prompt("GLB/GLTF モデルURL", toAssetUrl(currentModel));
    });
    iosModelUrlBtn.addEventListener("click", showIosModelUrl);
    directUsdZBtn.addEventListener("click", openUsdZDirectly);
    clearModelBtn.addEventListener("click", () => {
      currentModel = "";
      currentIosModel = "";
      viewer.removeAttribute("src");
      viewer.removeAttribute("ios-src");
      setObjectStatus("MODEL CLEARED");
    });
    resetViewBtn.addEventListener("click", () => {
      viewer.cameraOrbit = "25deg 70deg 130%";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
    });

    chapterCorrectionBtn.addEventListener("click", () => {
      chapterCorrectionEnabled = !chapterCorrectionEnabled;
      updateChapterCorrectionStatus();
      setObjectStatus(`ARモデル補正 ${chapterCorrectionEnabled ? "ON" : "OFF"} / ×${chapterCorrectionFactor.toFixed(4)}`);
    });

    chapterCorrectionApplyBtn.addEventListener("click", () => {
      pdfCurrentScaleInput.value = "20";
      pdfTargetScaleInput.value = "70";
      applyPdfScaleConversion();
      updateChapterCorrectionStatus();
      setObjectStatus(`AR補正再反映: PDFは1/20→1/70固定 / モデルだけ×${chapterCorrectionFactor.toFixed(4)}`);
    });

    mobilePrevBtn.addEventListener("click", () => changeChapter(-1));
    mobileNextBtn.addEventListener("click", () => changeChapter(1));
    mobilePlayBtn.addEventListener("click", toggleMobilePlay);
    mobileArBtn.addEventListener("click", openAR);
    mobileRecordStartBtn?.addEventListener("click", startRecording);
    mobileRecordStopBtn?.addEventListener("click", stopRecording);
    mobilePanelBtn.addEventListener("click", () => {
      if (mobileQuickPanel.classList.contains("mobile-open")) closeMobilePanels();
      else openMobilePanel("quick");
    });
    mobileBack3dBtn.addEventListener("click", open3D);

    afterArNextBtn.addEventListener("click", toggleAfterArNext);
    mobileAfterArNextBtn.addEventListener("click", toggleAfterArNext);
    mobileNextArBtn.addEventListener("click", nextChapterAndOpenAR);

    mobileOpenRefBtn.addEventListener("click", () => openMobilePanel("ref"));
    mobileOpenObjectBtn.addEventListener("click", () => openMobilePanel("object"));
    mobileOpenPdfBtn.addEventListener("click", () => openMobilePanel("pdf"));
    mobileOpenAnimBtn.addEventListener("click", () => openMobilePanel("anim"));
    mobileDirectUsdZBtn.addEventListener("click", openUsdZDirectly);
    mobileResetViewBtn.addEventListener("click", () => {
      closeMobilePanels();
      viewer.cameraOrbit = "25deg 70deg 130%";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
    });
    mobileClosePanelsBtn.addEventListener("click", closeMobilePanels);

    playPauseBtn.addEventListener("click", () => {
      if (!currentModel) return;
      if (isPaused){
        viewer.play();
        isPaused = false;
        playPauseBtn.textContent = "一時停止";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "停止";
      } else {
        viewer.pause();
        isPaused = true;
        playPauseBtn.textContent = "再生";
        if (mobilePlayBtn) mobilePlayBtn.textContent = "再生";
      }
    });

    restartBtn.addEventListener("click", () => {
      playSelectedAnimation(animationSelect.value || viewer.animationName, true);
    });

    speedRange.addEventListener("input", () => {
      playSpeed = parseFloat(speedRange.value) || 0.8;
      speedText.textContent = playSpeed.toFixed(2) + "x";
      viewer.timeScale = playSpeed;
    });

    animationSelect.addEventListener("change", () => {
      if (!animationSelect.value) return;
      playSelectedAnimation(animationSelect.value, true);
    });

    applyPdfScaleBtn.addEventListener("click", applyPdfScaleConversion);
    resetPdfScaleBtn.addEventListener("click", resetPdfScaleConversion);
    pdfCurrentScaleInput.addEventListener("change", applyPdfScaleConversion);
    pdfTargetScaleInput.addEventListener("change", applyPdfScaleConversion);

    back3dBtn.addEventListener("click", open3D);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden){
        if (arLaunchPending){
          arReturnObservedHidden = true;
        }
      }else{
        if (arLaunchPending && arReturnObservedHidden){
          setTimeout(() => handleReturnFromAR("visibility"), 300);
        }
      }
    });

    window.addEventListener("focus", () => {
      if (arLaunchPending && arReturnObservedHidden){
        setTimeout(() => handleReturnFromAR("focus"), 300);
      }
    });

    window.addEventListener("pageshow", (event) => {
      if (event.persisted){
        setTimeout(() => handleReturnFromAR("pageshow"), 300);
      }
    });

    if (initialRoot) rootInput.value = initialRoot;
    chapterCorrectionBtn.classList.toggle("lime", chapterCorrectionEnabled);
    updateChapterCorrectionStatus();


    // Temporary: PDF preview loading is disabled.
    const PDF_PREVIEW_DISABLED = true;
    loadPdfPreview = async function(){
      pdfFloorPreview.removeAttribute("src");
      pdfSidePreview.removeAttribute("src");
      setPdfStatus("PDF読込OFF");
    };
    loadChapterPdfPreviews = async function(){
      pdfFloorPreview.removeAttribute("src");
      pdfSidePreview.removeAttribute("src");
      setPdfStatus("PDF読込OFF");
    };

    updateAfterArNextButtons();
    loadReferenceRoot();
  </script>
</body>
</html>
