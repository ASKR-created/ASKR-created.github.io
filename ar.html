<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF AR Viewer - Teaching Contest v24</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs"></script>

  <style>
    :root{
      --panel:rgba(8,16,32,.88);
      --cyan:#22f8ff;
      --lime:#a6ff2d;
      --magenta:#ff2deb;
      --text:#eafbff;
      --sub:#96a8c8;
      --line:rgba(34,248,255,.34);
      --shadow:0 0 18px rgba(34,248,255,.18),0 0 30px rgba(255,45,235,.08);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(34,248,255,.10), transparent 28%),
        radial-gradient(circle at 86% 76%, rgba(255,45,235,.10), transparent 32%),
        linear-gradient(135deg,#02030a,#061020 58%,#050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:50;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,248,255,.022) 1px,transparent 1px);
      background-size:4px 4px,18px 18px;
      mix-blend-mode:screen;
    }

    #app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    model-viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:transparent;
      --poster-color:transparent;
      --progress-bar-color:#22f8ff;
      --progress-bar-height:3px;
    }

    .refbar{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:20;
      border:1px solid var(--line);
      background:linear-gradient(90deg,rgba(8,16,32,.86),rgba(12,28,56,.64));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
    }

    .refbar-head{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      min-height:48px;
    }

    .rgb-line{
      height:3px;
      margin-bottom:6px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.60);
    }

    .title{
      font-size:17px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .subtitle{
      margin-top:3px;
      color:var(--sub);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .refbar-body{
      display:grid;
      grid-template-columns:1.4fr auto 1fr auto auto;
      gap:8px;
      padding:0 12px 10px;
      align-items:end;
    }

    .refbar.collapsed .refbar-body{
      display:none;
    }

    .side{
      position:absolute;
      top:124px;
      bottom:86px;
      width:min(340px,calc(50vw - 18px));
      z-index:12;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .side.left{left:10px}
    .side.right{right:10px}

    .side-head{
      padding:10px 12px;
      border-bottom:1px solid rgba(34,248,255,.20);
      background:linear-gradient(90deg,rgba(34,248,255,.10),rgba(255,45,235,.07));
      color:var(--cyan);
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .side-body{
      padding:10px;
      overflow:auto;
      min-height:0;
      flex:1 1 auto;
    }

    .playbar{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:22;
      min-height:66px;
      border:1px solid var(--line);
      background:rgba(4,10,20,.84);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:auto auto 1fr auto auto auto;
      gap:8px;
      align-items:center;
      padding:8px;
    }

    .speedbox{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      align-items:center;
      min-width:260px;
    }

    button,.btn{
      min-height:38px;
      border:1px solid rgba(34,248,255,.40);
      background:linear-gradient(180deg,rgba(15,28,58,.94),rgba(3,8,18,.94));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
      padding:0 12px;
    }

    button:hover,.btn:hover{
      border-color:var(--cyan);
      box-shadow:0 0 14px rgba(34,248,255,.22);
    }

    button.lime,.btn.lime{
      border-color:rgba(166,255,45,.52);
      color:var(--lime);
    }

    button.magenta,.btn.magenta{
      border-color:rgba(255,45,235,.52);
      color:#ffd4fb;
    }

    input,select{
      width:100%;
      min-height:34px;
      border:1px solid rgba(34,248,255,.35);
      background:rgba(1,5,14,.88);
      color:var(--text);
      padding:6px 8px;
      outline:none;
      font-size:13px;
    }

    input[type="range"]{
      accent-color:var(--lime);
      padding:0;
    }

    label{
      color:var(--sub);
      font-size:11px;
      display:block;
      margin:8px 0 3px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .status{
      margin-top:8px;
      border:1px solid rgba(166,255,45,.26);
      background:rgba(166,255,45,.045);
      color:var(--lime);
      padding:8px;
      font-size:12px;
      line-height:1.45;
      word-break:break-all;
      font-family:Consolas,"MS UI Gothic",monospace;
    }

    .info-row{
      display:grid;
      grid-template-columns:86px 1fr;
      gap:8px;
      padding:5px 0;
      border-bottom:1px solid rgba(34,248,255,.08);
      font-size:12px;
    }

    .info-row .k{color:var(--sub)}
    .info-row .v{word-break:break-all}

    .pdf-preview{
      width:100%;
      aspect-ratio:1.414/1;
      object-fit:contain;
      background:white;
      border:1px solid rgba(34,248,255,.35);
      margin-top:8px;
      opacity:.85;
    }

    .ar-button{
      position:absolute;
      left:50%;
      bottom:96px;
      transform:translateX(-50%);
      z-index:18;
      min-width:min(420px,calc(100vw - 48px));
      min-height:54px;
      border:2px solid rgba(166,255,45,.72);
      background:linear-gradient(180deg,rgba(24,48,18,.92),rgba(4,14,8,.94));
      color:var(--lime);
      font-size:18px;
      font-weight:bold;
      letter-spacing:.10em;
      box-shadow:0 0 22px rgba(166,255,45,.22);
      cursor:pointer;
    }

    @media (max-width:980px){
      html,body{overflow:auto;height:auto}
      #app{position:relative;height:auto;min-height:100vh;overflow:visible;padding:8px}
      model-viewer{position:relative;height:50vh;min-height:360px;border:1px solid var(--line);margin-top:8px}
      .refbar,.side,.playbar{position:relative;top:auto;left:auto;right:auto;bottom:auto;width:auto;margin:0 0 8px}
      .refbar{clip-path:none}
      .refbar-body{grid-template-columns:1fr;align-items:stretch}
      .playbar{grid-template-columns:1fr 1fr;align-items:stretch}
      .speedbox{grid-column:1/-1;min-width:0}
      .ar-button{position:fixed;bottom:92px;font-size:16px}
      .title{font-size:14px}
    }
  </style>
</head>
<body>
  <div id="app">
    <model-viewer
      id="viewer"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="0.75"
      exposure="1.1"
      ar
      ar-modes="quick-look scene-viewer webxr"
      ar-scale="auto"
      ar-placement="floor"
      autoplay
    >
      <button slot="ar-button" class="ar-button" id="nativeArButton">ARで見る</button>
    </model-viewer>

    <section class="refbar" id="refbar">
      <div class="refbar-head">
        <div>
          <div class="rgb-line"></div>
          <div class="title">SF AR VIEWER / TEACHING CONTEST v24</div>
          <div class="subtitle">参照フォルダ → チャプター選択 → GLBとPDFを同時読込</div>
        </div>
        <button class="btn" id="collapseRefBtn">参照フォルダ収納</button>
        <button class="btn lime" id="scanBtn">参照読込</button>
      </div>

      <div class="refbar-body">
        <div>
          <label>参照フォルダ</label>
          <input id="rootInput" value="teaching-contest" placeholder="teaching-contest または 教材コンクール">
        </div>
        <button class="btn" id="autoRootBtn">自動検出</button>
        <div>
          <label>チャプターフォルダ</label>
          <select id="chapterSelect">
            <option value="">未読込</option>
          </select>
        </div>
        <button class="btn" id="prevChapterBtn">前CH</button>
        <button class="btn" id="nextChapterBtn">次CH</button>
      </div>
    </section>

    <aside class="side left">
      <div class="side-head">OBJECT OPERATION</div>
      <div class="side-body">
        <div class="info-row"><div class="k">CHAPTER</div><div class="v" id="chapterNameText">未選択</div></div>
        <div class="info-row"><div class="k">MODEL</div><div class="v" id="modelPathText">未読込</div></div>

        <div class="grid2">
          <button class="btn lime" id="arStartBtn">ARで見る</button>
          <button class="btn" id="resetViewBtn">視点リセット</button>
        </div>

        <div class="grid2">
          <button class="btn" id="modelUrlBtn">モデルURL表示</button>
          <button class="btn magenta" id="clearModelBtn">モデル消去</button>
        </div>

        <div class="status" id="objectStatus">OBJECT READY</div>
      </div>
    </aside>

    <aside class="side right">
      <div class="side-head">PDF OPERATION</div>
      <div class="side-body">
        <div class="info-row"><div class="k">PDF</div><div class="v" id="pdfPathText">未読込</div></div>
        <img id="pdfPreview" class="pdf-preview" alt="PDF preview">
        <div class="status" id="pdfStatus">PDF READY</div>
        <div class="status">PDFはAR起動前の確認用です。実ARへ渡すのはGLB/GLTFモデルです。</div>
      </div>
    </aside>

    <section class="playbar">
      <button class="btn" id="prevBottomBtn">前CH</button>
      <button class="btn lime" id="playPauseBtn">再生</button>
      <button class="btn" id="restartBtn">最初から</button>

      <div class="speedbox">
        <span>速度</span>
        <input id="speedRange" type="range" min="0.05" max="2.0" step="0.05" value="0.80">
        <span id="speedText">0.80x</span>
      </div>

      <select id="animationSelect">
        <option value="">アニメーションなし</option>
      </select>
      <button class="btn magenta" id="back3dBtn">3Dへ戻る</button>
    </section>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

    const GITHUB_OWNER = "ASKR-created";
    const GITHUB_REPO = "ASKR-created.github.io";
    const GITHUB_REF = "main";

    const ROOT_CANDIDATES = [
      "teaching-contest",
      "teaching_contest",
      "teachingContest",
      "kyozai-contest",
      "kyozai_contest",
      "教材コンクール"
    ];

    const MODEL_EXTS = [".glb", ".gltf", ".usdz"];
    const PDF_EXTS = [".pdf", ".png", ".jpg", ".jpeg", ".webp"];

    const viewer = document.getElementById("viewer");
    const refbar = document.getElementById("refbar");
    const collapseRefBtn = document.getElementById("collapseRefBtn");
    const scanBtn = document.getElementById("scanBtn");
    const autoRootBtn = document.getElementById("autoRootBtn");
    const rootInput = document.getElementById("rootInput");
    const chapterSelect = document.getElementById("chapterSelect");
    const prevChapterBtn = document.getElementById("prevChapterBtn");
    const nextChapterBtn = document.getElementById("nextChapterBtn");
    const chapterNameText = document.getElementById("chapterNameText");
    const modelPathText = document.getElementById("modelPathText");
    const pdfPathText = document.getElementById("pdfPathText");
    const pdfPreview = document.getElementById("pdfPreview");
    const objectStatus = document.getElementById("objectStatus");
    const pdfStatus = document.getElementById("pdfStatus");
    const arStartBtn = document.getElementById("arStartBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const modelUrlBtn = document.getElementById("modelUrlBtn");
    const clearModelBtn = document.getElementById("clearModelBtn");
    const prevBottomBtn = document.getElementById("prevBottomBtn");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const speedRange = document.getElementById("speedRange");
    const speedText = document.getElementById("speedText");
    const animationSelect = document.getElementById("animationSelect");
    const back3dBtn = document.getElementById("back3dBtn");

    let chapters = [];
    let currentChapterIndex = -1;
    let currentRoot = "";
    let currentModel = "";
    let playSpeed = 0.8;
    let isPaused = false;

    const params = new URLSearchParams(location.search);
    const initialRoot = params.get("root") ? decodeURIComponent(params.get("root")) : "";
    const initialChapter = params.get("chapter") ? decodeURIComponent(params.get("chapter")) : "";

    function setObjectStatus(text){
      objectStatus.textContent = text;
      console.log("[OBJECT]", text);
    }

    function setPdfStatus(text){
      pdfStatus.textContent = text;
      console.log("[PDF]", text);
    }

    function normalizePath(path){
      return String(path || "").trim().replace(/\\/g,"/").replace(/^\/+/,"").replace(/\/+$/,"");
    }

    function encodePath(path){
      return normalizePath(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return `${location.origin}/${encodePath(path)}`;
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function getBaseName(path){
      return String(path).split("/").pop() || path;
    }

    async function fetchGitHubContents(path){
      const safePath = path ? "/" + encodePath(path) : "";
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents${safePath}?ref=${encodeURIComponent(GITHUB_REF)}&_=${Date.now()}`;
      const res = await fetch(url, {headers:{"Accept":"application/vnd.github+json"}});
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${path || "/"}`);
      return await res.json();
    }

    async function scanChapter(chapterPath){
      const items = await fetchGitHubContents(chapterPath);
      const files = Array.isArray(items) ? items.filter(item => item.type === "file") : [];
      const model = files.find(f => MODEL_EXTS.includes(getExt(f.path))) || null;
      const pdf = files.find(f => PDF_EXTS.includes(getExt(f.path))) || null;

      return {
        name:getBaseName(chapterPath),
        path:chapterPath,
        model:model ? model.path : "",
        pdf:pdf ? pdf.path : "",
        files:files.map(f => f.path)
      };
    }

    async function scanRoot(root){
      root = normalizePath(root);
      const items = await fetchGitHubContents(root);
      const dirs = Array.isArray(items) ? items.filter(item => item.type === "dir") : [];
      const result = [];

      for (const d of dirs){
        const ch = await scanChapter(d.path);
        if (ch.model || ch.pdf) result.push(ch);
      }

      result.sort((a,b) => a.name.localeCompare(b.name, "ja"));
      return result;
    }

    async function autoDetectRoot(){
      for (const candidate of ROOT_CANDIDATES){
        try{
          const result = await scanRoot(candidate);
          if (result.length > 0){
            rootInput.value = candidate;
            chapters = result;
            currentRoot = candidate;
            populateChapters();
            setObjectStatus(`参照フォルダ検出: ${candidate}`);
            return true;
          }
        }catch(err){
          console.warn("root skipped:", candidate, err.message);
        }
      }

      setObjectStatus("参照フォルダが見つかりません。");
      return false;
    }

    async function loadReferenceRoot(){
      const root = normalizePath(rootInput.value || "");
      if (!root){
        await autoDetectRoot();
        return;
      }

      try{
        chapters = await scanRoot(root);
        currentRoot = root;
        populateChapters();
        setObjectStatus(`参照読込: ${root} / ${chapters.length} chapters`);

        if (chapters.length > 0){
          let index = 0;
          if (initialChapter){
            const found = chapters.findIndex(ch => ch.name === initialChapter || ch.path.endsWith("/" + initialChapter));
            if (found >= 0) index = found;
          }
          await loadChapter(index);
        }
      }catch(err){
        console.error(err);
        setObjectStatus("参照読込失敗: " + err.message);
        alert("参照フォルダの読み込みに失敗しました。\n\n" + root + "\n\n" + err.message);
      }
    }

    function populateChapters(){
      chapterSelect.innerHTML = "";

      if (chapters.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "チャプターなし";
        chapterSelect.appendChild(opt);
        return;
      }

      for (let i=0; i<chapters.length; i++){
        const ch = chapters[i];
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${ch.name} / ${ch.model ? getBaseName(ch.model) : "modelなし"} / ${ch.pdf ? getBaseName(ch.pdf) : "PDFなし"}`;
        chapterSelect.appendChild(opt);
      }
    }

    async function loadChapter(index){
      if (index < 0 || index >= chapters.length) return;

      currentChapterIndex = index;
      const ch = chapters[index];
      chapterSelect.value = String(index);

      chapterNameText.textContent = ch.name;
      modelPathText.textContent = ch.model || "未登録";
      pdfPathText.textContent = ch.pdf || "未登録";

      if (ch.model) await loadModel(ch.model);
      if (ch.pdf) await loadPdfPreview(ch.pdf);

      updateUrlState();
    }

    function updateUrlState(){
      const url = new URL(location.href);
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (chapters[currentChapterIndex]) url.searchParams.set("chapter", chapters[currentChapterIndex].name);
      history.replaceState(null, "", url.toString());
    }

    async function loadModel(path){
      currentModel = path;
      viewer.src = toAssetUrl(path);
      setObjectStatus("MODEL LOADING: " + path);
    }

    async function loadPdfPreview(path){
      try{
        setPdfStatus("PDF LOADING: " + path);
        const ext = getExt(path);

        if (ext === ".pdf"){
          const task = pdfjsLib.getDocument(toAssetUrl(path));
          const pdf = await task.promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({scale:1.2});
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d", {alpha:false});
          ctx.fillStyle = "#fff";
          ctx.fillRect(0,0,canvas.width,canvas.height);
          await page.render({canvasContext:ctx, viewport}).promise;
          pdfPreview.src = canvas.toDataURL("image/png");
        } else {
          pdfPreview.src = toAssetUrl(path);
        }

        setPdfStatus("PDF PREVIEW: " + path);
      }catch(err){
        console.error(err);
        setPdfStatus("PDF PREVIEW ERROR");
      }
    }

    function changeChapter(delta){
      if (chapters.length === 0) return;
      let next = currentChapterIndex + delta;
      if (next < 0) next = chapters.length - 1;
      if (next >= chapters.length) next = 0;
      loadChapter(next);
    }

    function refreshAnimations(){
      const animations = viewer.availableAnimations || [];
      animationSelect.innerHTML = "";

      if (animations.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "アニメーションなし";
        animationSelect.appendChild(opt);
        return;
      }

      for (const name of animations){
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        animationSelect.appendChild(opt);
      }

      animationSelect.value = animations[0];
      viewer.animationName = animations[0];
      viewer.timeScale = playSpeed;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
    }

    async function openAR(){
      if (!currentModel){
        alert("先にチャプターを選んでモデルを読み込んでください。");
        return;
      }

      try{
        await viewer.activateAR();
      }catch(err){
        console.error(err);
        alert("AR起動に失敗しました。\n\niPhoneの場合はSafariで試してください。\n保存になる場合はUSDZが必要な場合があります。");
      }
    }

    function open3D(){
      const ch = chapters[currentChapterIndex];
      const url = new URL(location.origin + location.pathname.replace(/\/[^\/]*$/, "/"));
      url.searchParams.set("v", "20260605_0002_v24");
      if (currentRoot) url.searchParams.set("root", currentRoot);
      if (ch) url.searchParams.set("chapter", ch.name);
      window.open(url.toString(), "_blank");
    }

    viewer.addEventListener("load", () => {
      refreshAnimations();
      setObjectStatus("読込完了: " + currentModel);
    });

    viewer.addEventListener("error", () => {
      setObjectStatus("MODEL LOAD ERROR");
    });

    viewer.addEventListener("ar-status", event => {
      setObjectStatus("AR STATUS: " + event.detail.status);
    });

    collapseRefBtn.addEventListener("click", () => {
      refbar.classList.toggle("collapsed");
      collapseRefBtn.textContent = refbar.classList.contains("collapsed") ? "参照フォルダ展開" : "参照フォルダ収納";
    });

    scanBtn.addEventListener("click", loadReferenceRoot);
    autoRootBtn.addEventListener("click", autoDetectRoot);
    chapterSelect.addEventListener("change", () => loadChapter(parseInt(chapterSelect.value,10)));
    prevChapterBtn.addEventListener("click", () => changeChapter(-1));
    nextChapterBtn.addEventListener("click", () => changeChapter(1));
    prevBottomBtn.addEventListener("click", () => changeChapter(-1));

    arStartBtn.addEventListener("click", openAR);
    modelUrlBtn.addEventListener("click", () => {
      if (!currentModel) return alert("モデル未読込");
      prompt("モデルURL", toAssetUrl(currentModel));
    });
    clearModelBtn.addEventListener("click", () => {
      currentModel = "";
      viewer.removeAttribute("src");
      setObjectStatus("MODEL CLEARED");
    });
    resetViewBtn.addEventListener("click", () => {
      viewer.cameraOrbit = "0deg 75deg auto";
      viewer.cameraTarget = "auto auto auto";
      viewer.fieldOfView = "auto";
    });

    playPauseBtn.addEventListener("click", () => {
      if (!currentModel) return;
      if (isPaused){
        viewer.play();
        isPaused = false;
        playPauseBtn.textContent = "一時停止";
      } else {
        viewer.pause();
        isPaused = true;
        playPauseBtn.textContent = "再生";
      }
    });

    restartBtn.addEventListener("click", () => {
      viewer.currentTime = 0;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
    });

    speedRange.addEventListener("input", () => {
      playSpeed = parseFloat(speedRange.value) || 0.8;
      speedText.textContent = playSpeed.toFixed(2) + "x";
      viewer.timeScale = playSpeed;
    });

    animationSelect.addEventListener("change", () => {
      if (!animationSelect.value) return;
      viewer.animationName = animationSelect.value;
      viewer.currentTime = 0;
      viewer.play();
      isPaused = false;
      playPauseBtn.textContent = "一時停止";
    });

    back3dBtn.addEventListener("click", open3D);

    if (initialRoot) rootInput.value = initialRoot;
    loadReferenceRoot();
  </script>
</body>
</html>
