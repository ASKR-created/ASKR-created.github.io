<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SF WebXR AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root{
      --bg0:#02030a;
      --bg1:#061020;
      --panel:rgba(8,16,32,.74);
      --cyan:#22f8ff;
      --magenta:#ff2deb;
      --lime:#a6ff2d;
      --yellow:#ffe66d;
      --text:#eafbff;
      --sub:#91a6c9;
      --line:rgba(34,248,255,.36);
      --shadow:0 0 18px rgba(34,248,255,.20), 0 0 36px rgba(255,45,235,.10);
    }

    *{ box-sizing:border-box; }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,248,255,.10), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,45,235,.12), transparent 32%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 55%, #050616);
      color:var(--text);
      font-family:"MS UI Gothic","Yu Gothic UI","Meiryo",sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,248,255,.025) 1px, transparent 1px);
      background-size:5px 5px,18px 18px;
      mix-blend-mode:screen;
    }

    #canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .hud{
      position:absolute;
      z-index:10;
      top:10px;
      left:10px;
      right:10px;
      pointer-events:none;
    }

    .brand{
      pointer-events:auto;
      border:1px solid rgba(34,248,255,.45);
      background:linear-gradient(90deg, rgba(8,16,32,.86), rgba(10,22,44,.62));
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      padding:10px 14px;
      max-width:680px;
    }

    .brand-line{
      height:2px;
      margin-bottom:7px;
      background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--lime));
      box-shadow:0 0 12px rgba(34,248,255,.65);
    }

    .brand-title{
      font-size:16px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 9px rgba(34,248,255,.7);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-sub{
      margin-top:4px;
      color:var(--sub);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .panel{
      position:absolute;
      z-index:11;
      left:10px;
      bottom:12px;
      width:430px;
      max-width:calc(100vw - 20px);
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      color:var(--text);
    }

    .panel-head{
      padding:9px 10px;
      border-bottom:1px solid rgba(34,248,255,.22);
      background:linear-gradient(90deg, rgba(34,248,255,.12), rgba(255,45,235,.08));
      color:var(--cyan);
      font-size:12px;
      font-weight:bold;
      letter-spacing:.12em;
      text-shadow:0 0 8px rgba(34,248,255,.6);
    }

    .panel-body{
      padding:10px;
      font-size:12px;
      line-height:1.6;
      color:var(--sub);
    }

    .button-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .btn{
      min-height:38px;
      border:1px solid rgba(34,248,255,.42);
      background:linear-gradient(180deg, rgba(15,28,58,.92), rgba(3,8,18,.92));
      color:var(--text);
      font-weight:bold;
      cursor:pointer;
      letter-spacing:.04em;
    }

    .btn:hover{
      border-color:var(--cyan);
      color:white;
      box-shadow:0 0 18px rgba(34,248,255,.22);
    }

    .btn.magenta{ border-color:rgba(255,45,235,.42); }
    .btn.magenta:hover{ border-color:var(--magenta); box-shadow:0 0 18px rgba(255,45,235,.24); }

    #ARButton{
      border:1px solid rgba(166,255,45,.60) !important;
      background:linear-gradient(180deg, rgba(15,28,58,.95), rgba(3,8,18,.95)) !important;
      color:var(--lime) !important;
      font-weight:bold !important;
      box-shadow:0 0 18px rgba(166,255,45,.18) !important;
    }

    .warning{ color:var(--yellow); }

    @media (max-width:820px){
      .hud{ top:8px; left:8px; right:8px; }
      .brand-title{ font-size:13px; }
      .brand-sub{ font-size:11px; }
      .panel{
        left:8px;
        right:8px;
        bottom:8px;
        width:auto;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="brand">
      <div class="brand-line"></div>
      <div class="brand-title">SF WebXR AR</div>
      <div class="brand-sub">Android Chrome / ARCore向け。非対応時は現在ARへフォールバック。</div>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">WEBXR STATUS</div>
    <div class="panel-body">
      <div id="statusText">起動確認中...</div>
      <div class="warning" id="fileText"></div>
      <div class="button-row">
        <button class="btn" id="backBtn">3Dへ戻る</button>
        <button class="btn magenta" id="fallbackBtn">現在ARで開く</button>
      </div>
      <div style="margin-top:8px;">AR開始後、床を認識したら画面をタップしてモデルを配置。</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { ARButton } from "three/addons/webxr/ARButton.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("canvas");
    const statusText = document.getElementById("statusText");
    const fileText = document.getElementById("fileText");
    const backBtn = document.getElementById("backBtn");
    const fallbackBtn = document.getElementById("fallbackBtn");

    const params = new URLSearchParams(location.search);
    const rawFile = params.get("file") ? decodeURIComponent(params.get("file")) : "";

    let camera, scene, renderer;
    let controller;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let model = null;
    let mixer = null;
    const clock = new THREE.Clock();

    function encodePath(path){
      return String(path).split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function toAssetUrl(path){
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return encodePath(path).replace(/%3A/g, ":");
    }

    function getExt(path){
      const m = String(path).toLowerCase().match(/\.[^.\/?#]+$/);
      return m ? m[0] : "";
    }

    function setStatus(text){
      statusText.textContent = text;
      console.log("[WEBXR]", text);
    }

    function openFallback(){
      if (!rawFile){
        location.href = location.origin + "/ar.html";
        return;
      }
      location.href = location.origin + "/ar.html?file=" + encodeURIComponent(rawFile);
    }

    backBtn.addEventListener("click", () => {
      location.href = location.origin + "/index.html";
    });
    fallbackBtn.addEventListener("click", openFallback);

    async function checkSupport(){
      if (!rawFile){
        fileText.textContent = "fileパラメータがありません。";
        setStatus("NO FILE");
        return false;
      }

      fileText.textContent = rawFile;

      const ext = getExt(rawFile);
      if (ext !== ".glb" && ext !== ".gltf"){
        setStatus("GLB / GLTFのみ対応。現在ARへ切替推奨。");
        return false;
      }

      if (!("xr" in navigator)){
        setStatus("この端末またはブラウザはWebXRに非対応です。現在ARを使用してください。");
        return false;
      }

      try{
        const supported = await navigator.xr.isSessionSupported("immersive-ar");
        if (!supported){
          setStatus("immersive-ar非対応です。現在ARを使用してください。");
          return false;
        }
        setStatus("WebXR AR対応。AR STARTボタンを押してください。");
        return true;
      }catch(err){
        setStatus("WebXR確認に失敗。現在ARを使用してください。");
        return false;
      }
    }

    function init(){
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.xr.enabled = true;

      const hemi = new THREE.HemisphereLight(0xffffff, 0x202040, 1.6);
      scene.add(hemi);

      const light = new THREE.DirectionalLight(0xffffff, 1.8);
      light.position.set(2, 5, 3);
      scene.add(light);

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.12, 0.16, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x22f8ff })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      });
      document.body.appendChild(arButton);

      window.addEventListener("resize", onWindowResize);
      renderer.setAnimationLoop(render);
    }

    async function loadModel(){
      const loader = new GLTFLoader();
      const src = toAssetUrl(rawFile);
      setStatus("モデル読み込み中...");

      const gltf = await loader.loadAsync(src);
      model = gltf.scene || gltf.scenes[0];

      model.traverse(child => {
        if (child.isMesh){
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material && child.material.map){
            child.material.map.colorSpace = THREE.SRGBColorSpace;
          }
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      model.position.sub(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 0.7 / maxDim;
      model.scale.setScalar(scale);

      model.visible = false;
      scene.add(model);

      if (gltf.animations && gltf.animations.length){
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach(clip => mixer.clipAction(clip).play());
      }

      setStatus("読み込み完了。AR開始後、床をタップして配置。");
    }

    function onSelect(){
      if (reticle.visible && model){
        model.position.setFromMatrixPosition(reticle.matrix);
        model.visible = true;
        setStatus("モデルを配置しました。");
      }
    }

    function onWindowResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame){
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (frame){
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested){
          session.requestReferenceSpace("viewer").then(referenceSpaceViewer => {
            session.requestHitTestSource({ space: referenceSpaceViewer }).then(source => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            if (model) model.visible = false;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource){
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length){
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }

    const supported = await checkSupport();
    init();

    if (supported){
      try{
        await loadModel();
      }catch(err){
        console.error(err);
        setStatus("モデル読み込み失敗。現在ARを使用してください。");
      }
    }
  </script>
</body>
</html>
